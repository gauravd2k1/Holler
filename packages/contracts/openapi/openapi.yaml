openapi: 3.0.3
info:
  title: Holler API — Vertical Slice
  version: "0.3.0"
  description: >
    Covers only the §70 order endpoints needed for the Milestone 1–2 vertical
    slice (Menu → POS Order → Local SQLite → KOT → KDS → Cloud sync). Frozen
    at Milestone 0.5 alongside the rest of packages/contracts (ADR-008).
    Schemas here must stay in sync with src/types/*.ts and go/*.go —
    enforced by the CI contract-drift check.

servers:
  - url: http://localhost:8080
    description: local backend (docker compose, WSL2)

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /orders:
    post:
      summary: >
        Replay an order created at the edge (§50.1, ADR-009). The cloud never
        originates an order — record_id is the edge-assigned UUIDv7. Envelope
        aggregate_type must be `order` and direction EDGE_TO_CLOUD; a mismatch
        is 422, never a coercion. Idempotent: replaying the same record_id and
        version must not duplicate the order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderEnvelope"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}:
    get:
      summary: Fetch an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "404":
          description: Not found

  /orders/{id}/items:
    post:
      summary: >
        Replay an item appended to a DRAFT order at the edge. Financial line
        items are append-only (§51) — this never updates or removes a line.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemEnvelope"
      responses:
        "200":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/items/{itemId}:
    delete:
      summary: >
        Replay a line removal from a DRAFT order at the edge. Added at 0.3.0
        (ADR-014) to close a routability hole: ItemRemoved has been frozen in
        OUTBOX_EVENT_TYPES since 0.2.3 and edge/database emits it, but no route
        accepted it — so a removal could be written to the outbox and could
        never arrive. The drift check did not catch this, because it verifies
        that an event type appears in Rust, not that it is deliverable.
        Recorded in docs/backlog-m2.md under Contracts.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemEnvelope"
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/kots:
    post:
      summary: >
        Replay a KOT generated at the edge. Added at 0.3.0 (ADR-014) — KOTCreated
        was frozen at Milestone 0.5 and had no ingest route until Milestone 2
        made the edge actually generate tickets.

        The KOT is edge-authoritative (§50.1): the cloud stores what it replays
        and never generates, renumbers or re-routes a ticket.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KotEnvelope"
      responses:
        "200":
          description: KOT stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kot"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /kots/{kotId}/status:
    post:
      summary: >
        Replay a KOT status transition recorded at the edge (KOTStatusChanged,
        added at 0.3.0). Cooks drive this from KDS screens over the outlet LAN;
        by the time it reaches here it has already happened.

        This is the ONLY route that writes kot.status, and it only ever replays.
        No cloud-side handler may transition a ticket: the kitchen is the
        authority for what the kitchen is doing (§50.1), and a cloud write would
        make the aggregate split-authority.
      parameters:
        - $ref: "#/components/parameters/KotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KotStatusEnvelope"
      responses:
        "200":
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kot"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/send-to-kitchen:
    post:
      summary: >
        Replay the SENT_TO_KITCHEN transition.

        The kots array is a read-back convenience, not the ingest path. The edge
        generates tickets and replays each one through POST /orders/{id}/kots,
        which is the only route that creates a KOT (0.3.0, ADR-014). Returning
        them here as well lets a caller confirm the order's tickets in one round
        trip; it must never be treated as a second way to create them.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCommandEnvelope"
      responses:
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
        "200":
          description: KOTs generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/CanonicalOrder"
                  kots:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kot"

  /orders/{id}/confirm:
    post:
      summary: >
        Replay the DRAFT→CONFIRMED transition from the edge. Added at 0.2.5:
        the generic transition routes carry no payload, so confirmed_at had no
        way to reach the cloud and the column went unstamped by any production
        path. The edge is authoritative for order transactions (§50.1), so the
        timestamp is the moment the EDGE recorded — the cloud stores what it
        replays and never substitutes its own clock.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderConfirmEnvelope"
      responses:
        "200":
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "409":
          description: Illegal transition — the order was not in DRAFT
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/cancel:
    post:
      summary: Replay an order cancellation (authorized, audited — see docs/spec/security-rbac.md)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelEnvelope"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /outlets/{outletId}/table-sessions:
    post:
      summary: >
        Replay a table seating opened at the edge. table_session is an
        edge-authoritative operational aggregate (ADR-011) and rides the same
        envelope ingest pattern as orders — there is no unwrapped REST write
        route for it. Envelope aggregate_type must be `table_session` and
        direction EDGE_TO_CLOUD.
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSessionEnvelope"
      responses:
        "201":
          description: Session replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
    get:
      summary: List open sessions for an outlet (read path, not envelope-wrapped)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      responses:
        "200":
          description: Open sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TableSession" }

  /outlets/{outletId}/table-sessions/{sessionId}:
    post:
      summary: >
        Replay a session state transition or close from the edge. The state
        machine is validated cloud-side; an illegal transition is rejected
        rather than applied.
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - $ref: "#/components/parameters/TableSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSessionEnvelope"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "409":
          description: Illegal state transition
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
    get:
      summary: Fetch a session (read path, not envelope-wrapped)
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - $ref: "#/components/parameters/TableSessionId"
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "404":
          description: Not found

  /menu/items/{itemId}/availability:
    post:
      summary: >
        Snooze or un-snooze a menu item. A catalog write like any other: bumps
        the outlet's config_version so the edge replaces the item on its next
        config pull (§50.1). Permission: menu.manage. Audited.
      parameters:
        - $ref: "#/components/parameters/MenuItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              additionalProperties: false
              properties:
                available: { type: boolean }
                reason:
                  type: string
                  maxLength: 280
                  description: Optional operator note, recorded on the audit event.
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "403":
          description: Missing menu.manage permission
        "404":
          description: No such item in the caller's tenant

  /auth/login:
    post:
      summary: Authenticate a user and open a session (Argon2id verify, §56)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, outlet_id]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                outlet_id: { type: string, format: uuid }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, principal]
                properties:
                  access_token: { type: string, description: short-lived }
                  refresh_token: { type: string, description: rotated on every use }
                  principal: { $ref: "#/components/schemas/AuthenticatedPrincipal" }
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401":
          description: Invalid or reused refresh token

  /auth/logout:
    post:
      summary: Revoke the current session's refresh token
      responses:
        "204":
          description: Logged out

  /users:
    get:
      summary: List users in the caller's tenant (permission user.manage)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
    post:
      summary: Create a user (id is client-supplied UUIDv7, §74)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, email, full_name, password]
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }
                full_name: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /users/{id}/roles:
    put:
      summary: Replace a user's role assignments (permission user.manage, audited)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [id, role_id]
                properties:
                  id: { type: string, format: uuid }
                  role_id: { type: string, format: uuid }
                  outlet_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: null = tenant-wide
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /roles:
    get:
      summary: List the tenant's roles and their permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }

  /outlets:
    get:
      summary: List outlets the caller may access (tenant-isolated)
      responses:
        "200":
          description: Outlets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Outlet" }

  /outlets/{outletId}/tables:
    get:
      summary: List the outlet's table definitions (configuration)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RestaurantTable" }
    post:
      summary: Create a table definition (permission table.manage; bumps config_version)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestaurantTable" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantTable" }

  /menu/categories:
    get:
      summary: List menu categories for an outlet
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuCategory" }
    post:
      summary: Create a category (permission menu.manage; bumps config_version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuCategory" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuCategory" }

  /menu/items:
    get:
      summary: List menu items for an outlet
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
    post:
      summary: Create a menu item (permission menu.manage; bumps config_version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItem" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }

  /stations:
    get:
      summary: List stations for an outlet (permission menu.manage)
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }
    post:
      summary: >
        Create a station (permission menu.manage; bumps config_version). Added
        at 0.3.0 (ADR-014). Config, cloud→edge — the edge never creates one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outlet_id, code, name]
              properties:
                id:
                  type: string
                  format: uuid
                  description: App-generated UUIDv7 (§74). The server never mints it.
                outlet_id: { type: string, format: uuid }
                code:
                  type: string
                  description: Stable machine code, unique per outlet — not globally.
                name: { type: string }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses:
        "201":
          description: Station created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "409":
          description: A station with that code already exists for this outlet

  /menu/items/{itemId}/stations:
    put:
      summary: >
        Replace an item's station routing (permission menu.manage; bumps
        config_version). Added at 0.3.0 (ADR-014).

        PUT, not POST: routing is a set, the edge replaces config wholesale
        rather than merging (§50.1), and an append-only route would leave no way
        to stop an item printing at a station it no longer belongs to.
      parameters:
        - $ref: "#/components/parameters/MenuItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_ids]
              properties:
                station_ids:
                  type: array
                  description: >
                    May contain more than one — an item can route to several
                    stations (docs/spec/kitchen.md §Stations). An empty array
                    means the item produces no ticket, which is legitimate for
                    a non-production line such as a service charge.
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Routing replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItemStation" }

  /printers:
    get:
      summary: List printers for an outlet (permission outlet.manage)
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Printers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Printer" }
    post:
      summary: >
        Register a printer (permission outlet.manage; bumps config_version).
        Added at 0.3.0 (ADR-014).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outlet_id, name, connection_kind, address, paper_width_mm]
              properties:
                id:
                  type: string
                  format: uuid
                  description: App-generated UUIDv7 (§74).
                outlet_id: { type: string, format: uuid }
                name: { type: string }
                connection_kind: { $ref: "#/components/schemas/PrinterConnectionKind" }
                address: { type: string }
                paper_width_mm: { type: integer, enum: [58, 80] }
                is_active: { type: boolean }
      responses:
        "201":
          description: Printer registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Printer" }
        "409":
          description: A printer with that name already exists for this outlet

  /stations/{stationId}/printers:
    put:
      summary: >
        Replace a station's printer routing (permission outlet.manage; bumps
        config_version). Added at 0.3.0 (ADR-014). Tandoor → Printer A, Bar →
        Printer B (docs/spec/hardware-printing.md §Printing). PUT for the same
        reason item routing is: config is replaced, not merged.
      parameters:
        - $ref: "#/components/parameters/StationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printer_ids]
              properties:
                printer_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Routing replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationPrinter" }

  /sync/config:
    get:
      summary: >
        Pull authorized configuration newer than since_version (cloud→edge,
        §50.1). Returns only CLOUD_TO_EDGE aggregates; the edge replaces each
        aggregate wholesale rather than merging.
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: since_version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Configuration bundle
          content:
            application/json:
              schema:
                type: object
                required:
                  [config_version, users, tables, categories, items,
                   stations, item_stations, printers, station_printers]
                properties:
                  config_version: { type: integer }
                  users:
                    type: array
                    description: >
                      Credential material is included ONLY on this endpoint and
                      ONLY as Argon2id hashes, so the edge can authenticate
                      offline. The edge stores it in an encrypted-at-rest
                      database (ADR-011). Never returned by /users.
                    items: { $ref: "#/components/schemas/EdgeUserCacheEntry" }
                  # `roles` was removed at 0.2.2 — the only non-additive change
                  # in that bump. The edge has no role table by design;
                  # permissions arrive pre-flattened on each user entry, so the
                  # field promised storage that does not exist and the sync
                  # worker parsed then discarded it.
                  tables:
                    type: array
                    items: { $ref: "#/components/schemas/RestaurantTable" }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/MenuCategory" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MenuItem" }
                  # Added at 0.3.0 (ADR-014). Growing the `required` list is the
                  # one non-additive part of this bump: the edge sync worker is
                  # the sole consumer and is updated in the same milestone, so a
                  # tolerated-absence field would only hide a half-configured
                  # kitchen until the first ticket failed to route.
                  stations:
                    type: array
                    items: { $ref: "#/components/schemas/Station" }
                  item_stations:
                    type: array
                    description: Item → station routing; an item may appear more than once.
                    items: { $ref: "#/components/schemas/MenuItemStation" }
                  printers:
                    type: array
                    items: { $ref: "#/components/schemas/Printer" }
                  station_printers:
                    type: array
                    items: { $ref: "#/components/schemas/StationPrinter" }

components:
  responses:
    EnvelopeRouteMismatch:
      description: >
        The envelope's aggregate_type or direction does not match the route.
        Each ingest route pins its aggregate, and §50.1 pins that aggregate's
        direction, so a mismatch is a protocol violation and is rejected —
        never coerced into the route's expected values.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: envelope_route_mismatch }
              message: { type: string }

  parameters:
    MenuItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    KotId:
      name: kotId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    StationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TableSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OutletId:
      name: outletId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SyncDirection:
      type: string
      enum: [EDGE_TO_CLOUD, CLOUD_TO_EDGE]

    AggregateType:
      type: string
      description: >
        Milestone 2 added station and printer (config, cloud→edge). Deliberately
        absent: print_job and kot_status_history are edge-local, and
        refresh_token is cloud-only — listing any of them would promise a sync
        direction for something that never crosses the boundary.
      enum:
        [order, kot, payment, table_session, menu_item, app_user, role,
         restaurant_table, station, printer]

    SyncEnvelope:
      type: object
      description: >
        The single wire shape for replaying an edge-authoritative aggregate to
        the cloud (§50.1, ADR-009). Mirrors src/types/sync.ts SyncEnvelopeSchema
        and go/sync.go SyncEnvelope. It exists on the wire because record_id,
        device_id and version are edge-owned facts that the payload types do
        not carry — CanonicalOrder has no version field by design; the envelope
        is the concurrency token's home. There is no unwrapped write route for
        any EDGE_TO_CLOUD aggregate.
      required:
        [record_id, tenant_id, outlet_id, device_id, aggregate_type, direction,
         created_at, updated_at, version, sync_status, payload]
      properties:
        record_id:
          type: string
          format: uuid
          description: The wrapped entity's own edge-assigned UUIDv7. The cloud never mints it.
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        aggregate_type: { $ref: "#/components/schemas/AggregateType" }
        direction: { $ref: "#/components/schemas/SyncDirection" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          type: integer
          description: Optimistic concurrency / config version, per-aggregate policy (sync.md §51).
        sync_status: { type: string, enum: [PENDING, SYNCED, FAILED] }
        payload: { type: object }

    OrderEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/CanonicalOrder" }

    OrderItemEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/OrderItem" }

    OrderCommandEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              additionalProperties: false

    OrderConfirmEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [confirmed_at]
              additionalProperties: false
              properties:
                confirmed_at:
                  type: string
                  format: date-time
                  description: When the EDGE recorded the confirmation, not when the cloud received it.

    OrderCancelEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }

    KotEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [kot] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/Kot" }

    KotStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [kot] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [status, changed_at, changed_by_device_id]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/KotStatus" }
                changed_at:
                  type: string
                  format: date-time
                  description: >
                    When the EDGE recorded the transition, not when the cloud
                    received it. Kitchen timing analytics are the point of this
                    route; an outlet syncing hourly would otherwise report every
                    ticket as prepared in the same instant.
                changed_by_device_id: { type: string, format: uuid }

    TableSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [table_session] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/TableSession" }

    RoleCode:
      type: string
      description: docs/spec/security-rbac.md §Roles
      enum:
        [
          PLATFORM_SUPER_ADMIN,
          ORGANISATION_OWNER,
          BRAND_ADMIN,
          REGIONAL_MANAGER,
          OUTLET_MANAGER,
          ACCOUNTANT,
          INVENTORY_MANAGER,
          PURCHASE_MANAGER,
          CHEF,
          KITCHEN_STAFF,
          CAPTAIN,
          WAITER,
          CASHIER,
          DELIVERY_STAFF,
          AUDITOR,
        ]

    Permission:
      type: string
      description: Milestone 1 permission set; extended per milestone.
      enum:
        [
          order.create,
          order.modify,
          order.cancel,
          order.void,
          menu.manage,
          table.manage,
          outlet.manage,
          user.manage,
        ]

    Role:
      type: object
      required: [id, tenant_id, code, name, permissions, schema_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/RoleCode" }
        name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        schema_version: { type: integer, enum: [1] }

    RoleAssignment:
      type: object
      required: [id, role_id, role_code]
      properties:
        id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_code: { $ref: "#/components/schemas/RoleCode" }
        outlet_id:
          type: string
          format: uuid
          nullable: true
          description: null = tenant-wide assignment

    AppUser:
      type: object
      description: >
        Wire shape only. Carries no credential material — password_hash and
        pin_hash never leave the database (ADR-011).
      required: [id, tenant_id, email, full_name, is_active, roles, config_version, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        is_active: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        config_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }

    EdgeUserCacheEntry:
      type: object
      description: >
        Returned only by /sync/config, only over TLS, only to an enrolled edge
        node. Stored in the encrypted-at-rest edge database (ADR-011).
      required: [id, tenant_id, outlet_id, email, full_name, password_hash, is_active, permissions, config_version, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        password_hash: { type: string, description: Argon2id encoded string; never logged }
        pin_hash: { type: string, nullable: true }
        is_active: { type: boolean }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        config_version: { type: integer }
        updated_at:
          type: string
          format: date-time
          description: >
            Added at 0.2.2. sqlite app_user.updated_at is NOT NULL, so without
            this the edge had to synthesize a wall-clock value on every pull.
            Not used for staleness comparison — config_version drives
            replace-or-ignore.

    AuthenticatedPrincipal:
      type: object
      required: [user_id, tenant_id, outlet_id, full_name, permissions, authenticated_offline, schema_version]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        full_name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        authenticated_offline:
          type: boolean
          description: true when verified against the edge user cache
        schema_version: { type: integer, enum: [1] }

    Outlet:
      type: object
      required: [id, brand_id, name, timezone, config_version]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: Asia/Kolkata }
        config_version: { type: integer }

    RestaurantTable:
      type: object
      description: Pure configuration; live state lives in TableSession (ADR-011).
      required: [id, outlet_id, section, label, seat_count, is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        section: { type: string }
        label: { type: string, example: T4 }
        seat_count: { type: integer, minimum: 1 }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    TableSession:
      type: object
      description: Operational aggregate; edge-authoritative, replayed edge→cloud.
      required: [id, outlet_id, table_id, state, guest_count, opened_at, version, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        state:
          type: string
          enum: [OCCUPIED, ORDERED, KOT_SENT, FOOD_READY, BILL_REQUESTED, PAYMENT_PENDING, PAID, DIRTY, CLOSED]
        current_order_id: { type: string, format: uuid, nullable: true }
        guest_count: { type: integer, minimum: 1 }
        opened_by_user_id: { type: string, format: uuid, nullable: true }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }

    MenuCategory:
      type: object
      required: [id, outlet_id, name, sort_order, config_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        config_version: { type: integer }

    MenuItem:
      type: object
      required: [id, outlet_id, category_id, name, base_price_paise, is_available, config_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name: { type: string }
        base_price_paise: { type: integer, description: integer paise, never float }
        is_available: { type: boolean }
        config_version: { type: integer }

    OrderType:
      type: string
      enum: [DINE_IN, TAKEAWAY, DELIVERY, AGGREGATOR, QR, ROOM_SERVICE, CATERING]

    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SENT_TO_KITCHEN, PREPARING, READY, SERVED, BILLED, PAID, CLOSED, CANCELLED]

    OrderItemModifier:
      type: object
      required: [modifier_id, group_name, option_name, price_delta_paise]
      properties:
        modifier_id: { type: string, format: uuid }
        group_name: { type: string }
        option_name: { type: string }
        price_delta_paise: { type: integer }

    OrderItem:
      type: object
      required: [id, menu_item_id, quantity, unit_price_paise, line_total_paise]
      properties:
        id: { type: string, format: uuid }
        menu_item_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unit_price_paise: { type: integer }
        line_total_paise: { type: integer }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/OrderItemModifier" }
        notes: { type: string, nullable: true }

    CanonicalOrder:
      type: object
      description: See docs/spec/ordering.md §Canonical order model.
      required:
        - holler_order_id
        - source
        - outlet_id
        - order_type
        - status
        - items
        - subtotal_paise
        - total_paise
        - payment_status
        - timestamps
        - schema_version
      properties:
        holler_order_id: { type: string, format: uuid }
        external_order_id: { type: string, nullable: true }
        source:
          type: string
          enum: [POS, QR, AGGREGATOR_ZOMATO, AGGREGATOR_SWIGGY, DIRECT]
        outlet_id: { type: string, format: uuid }
        order_type: { $ref: "#/components/schemas/OrderType" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        table_id: { type: string, format: uuid, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal_paise: { type: integer }
        discount_paise: { type: integer, default: 0 }
        packaging_paise: { type: integer, default: 0 }
        delivery_charge_paise: { type: integer, default: 0 }
        taxes_paise: { type: integer, default: 0 }
        aggregator_discount_paise: { type: integer, default: 0 }
        merchant_discount_paise: { type: integer, default: 0 }
        total_paise: { type: integer }
        payment_status:
          type: string
          enum: [UNPAID, PARTIALLY_PAID, PAID, REFUNDED]
        payment_source: { type: string, nullable: true }
        preparation_time_minutes: { type: integer, nullable: true }
        timestamps:
          type: object
          required: [created_at, updated_at]
          properties:
            created_at: { type: string, format: date-time }
            confirmed_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }
        source_payload:
          type: object
          nullable: true
          description: Raw external payload, audit only.
        schema_version:
          type: integer
          enum: [1]

    # Milestone 2 config aggregates (0.3.0, ADR-014). Mirrors
    # src/types/station.ts, src/types/printer.ts and their Go structs.
    Station:
      type: object
      description: >
        A production destination — docs/spec/kitchen.md §Stations. CONFIG,
        cloud→edge. The live ticket at a station is a Kot, which is
        edge-authoritative; that split mirrors RestaurantTable/TableSession.
      required: [id, outlet_id, code, name, sort_order, is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        code:
          type: string
          description: >
            Stable machine code (MAIN_KITCHEN, TANDOOR, ...), unique per outlet
            and never globally. Kot.station stores this rather than a station
            id, so a ticket already on the pass survives a rename.
        name: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    MenuItemStation:
      type: object
      description: >
        Item → station routing. A join row rather than a column on MenuItem
        because an item may route to more than one station.
      required: [menu_item_id, station_id, config_version, schema_version]
      properties:
        menu_item_id: { type: string, format: uuid }
        station_id: { type: string, format: uuid }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    PrinterConnectionKind:
      type: string
      description: >
        Transport, not vendor. Brand differences are edge/printer adapter
        details. Label printers are excluded from Milestone 2 (§81).
      enum: [ESCPOS_NETWORK, ESCPOS_USB, ESCPOS_BLUETOOTH]

    Printer:
      type: object
      description: CONFIG, cloud→edge — docs/spec/hardware-printing.md.
      required:
        [id, outlet_id, name, connection_kind, address, paper_width_mm,
         is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        name: { type: string, description: Unique per outlet, not globally. }
        connection_kind: { $ref: "#/components/schemas/PrinterConnectionKind" }
        address:
          type: string
          description: >
            Interpreted only by the matching adapter — host:port, USB path or MAC.
        paper_width_mm: { type: integer, enum: [58, 80] }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    StationPrinter:
      type: object
      description: >
        Station → printer routing. Many-to-many both ways: one printer can serve
        two stations, and a station can fan out to two printers.
      required: [station_id, printer_id, config_version, schema_version]
      properties:
        station_id: { type: string, format: uuid }
        printer_id: { type: string, format: uuid }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    # DELIBERATELY ABSENT: PrintJob. The spool is edge-local — it crosses no
    # boundary, so it gets no wire schema and no route. The POS reads it across
    # the Tauri boundary using the TypeScript type in src/types/printer.ts.

    KotStatus:
      type: string
      description: >
        KOT lifecycle — docs/spec/kitchen.md §KOT. Extracted from the inline
        Kot.status enum at 0.3.0 so the status-transition route references one
        definition rather than repeating the list.
      enum: [NEW, ACKNOWLEDGED, PREPARING, READY, SERVED, CANCELLED]

    Kot:
      type: object
      description: One row per station ticket — see docs/spec/kitchen.md §12.
      required: [id, order_id, station, sequence, status, items, created_by_device_id, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        station: { type: string }
        sequence: { type: integer }
        status: { $ref: "#/components/schemas/KotStatus" }
        items:
          type: array
          items:
            type: object
            properties:
              order_item_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              modifiers:
                type: array
                items: { type: string }
              notes: { type: string, nullable: true }
        created_by_device_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version:
          type: integer
          enum: [1]
