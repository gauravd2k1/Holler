openapi: 3.0.3
info:
  title: Holler API — Vertical Slice
  version: "0.4.6"
  description: >
    Covers only the §70 order endpoints needed for the Milestone 1–2 vertical
    slice (Menu → POS Order → Local SQLite → KOT → KDS → Cloud sync). Frozen
    at Milestone 0.5 alongside the rest of packages/contracts (ADR-008).
    Schemas here must stay in sync with src/types/*.ts and go/*.go —
    enforced by the CI contract-drift check.

servers:
  - url: http://localhost:8080
    description: local backend (docker compose, WSL2)

paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /orders:
    post:
      summary: >
        Replay an order created at the edge (§50.1, ADR-009). The cloud never
        originates an order — record_id is the edge-assigned UUIDv7. Envelope
        aggregate_type must be `order` and direction EDGE_TO_CLOUD; a mismatch
        is 422, never a coercion. Idempotent: replaying the same record_id and
        version must not duplicate the order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderEnvelope"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}:
    get:
      summary: Fetch an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "404":
          description: Not found

  /orders/{id}/items:
    post:
      summary: >
        Replay an item appended to a DRAFT order at the edge. Financial line
        items are append-only (§51) — this never updates or removes a line.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemEnvelope"
      responses:
        "200":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/items/{itemId}:
    delete:
      summary: >
        Replay a line removal from a DRAFT order at the edge. Added at 0.3.0
        (ADR-014) to close a routability hole: ItemRemoved has been frozen in
        OUTBOX_EVENT_TYPES since 0.2.3 and edge/database emits it, but no route
        accepted it — so a removal could be written to the outbox and could
        never arrive. The drift check did not catch this, because it verifies
        that an event type appears in Rust, not that it is deliverable.
        Recorded in docs/backlog-m2.md under Contracts.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/OrderItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemEnvelope"
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/kots:
    post:
      summary: >
        Replay a KOT generated at the edge. Added at 0.3.0 (ADR-014) — KOTCreated
        was frozen at Milestone 0.5 and had no ingest route until Milestone 2
        made the edge actually generate tickets.

        The KOT is edge-authoritative (§50.1): the cloud stores what it replays
        and never generates, renumbers or re-routes a ticket.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KotEnvelope"
      responses:
        "200":
          description: KOT stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kot"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /kots/{kotId}/status:
    post:
      summary: >
        Replay a KOT status transition recorded at the edge (KOTStatusChanged,
        added at 0.3.0). Cooks drive this from KDS screens over the outlet LAN;
        by the time it reaches here it has already happened.

        This is the ONLY route that writes kot.status, and it only ever replays.
        No cloud-side handler may transition a ticket: the kitchen is the
        authority for what the kitchen is doing (§50.1), and a cloud write would
        make the aggregate split-authority.
      parameters:
        - $ref: "#/components/parameters/KotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KotStatusEnvelope"
      responses:
        "200":
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kot"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /devices/enroll:
    post:
      summary: >
        Enrol a device against an outlet and issue its credential. Frozen at
        0.4.1 (ADR-017).

        Returns the plaintext token EXACTLY ONCE. No route anywhere reads a
        token back — that is a structural guarantee, not a policy, and the
        absence of any such route is part of this contract.

        Only the credential issued here authenticates GET /sync/config, the one
        route carrying Argon2id password and PIN hashes. Before ADR-017 that
        route accepted an ordinary human bearer token, so an enrolled edge node
        and a logged-in browser session were indistinguishable to the backend.

        Credential rotation and revocation are implemented but deliberately NOT
        frozen here — see ADR-017 §Freezing scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, kind, name]
              properties:
                outlet_id: { type: string, format: uuid }
                kind:
                  type: string
                  enum: [POS, KDS, WAITER, PRINTER_BRIDGE]
                name:
                  type: string
                  description: >
                    Unique per outlet, never globally — two outlets each naming
                    a device POS1 is normal.
                label:
                  type: string
                  description: >
                    Free-text note for the technician: which machine, which
                    install visit.
      responses:
        "201":
          description: >
            Device enrolled. This is the ONLY response in the API that contains
            a credential token, and it is unrepeatable.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, outlet_id, kind, name, credential_id, token]
                properties:
                  device_id: { type: string, format: uuid }
                  outlet_id: { type: string, format: uuid }
                  kind: { type: string, enum: [POS, KDS, WAITER, PRINTER_BRIDGE] }
                  name: { type: string }
                  credential_id: { type: string, format: uuid }
                  token:
                    type: string
                    description: >
                      Plaintext, returned once and never recoverable. Present it
                      as `Authorization: Bearer <credential_id>.<secret>`. Never
                      log it, never store it in an audit value.
        "401":
          description: Caller is not authenticated.
        "403":
          description: Caller lacks permission to manage this outlet.
        "409":
          description: A device with this name already exists at this outlet.

  /invoices:
    post:
      summary: >
        Replay a GST invoice issued at the edge. Added at 0.4.0 (ADR-016).

        The invoice is edge-authoritative (§50.1): the outlet issues bills with
        the uplink down, and this route only ever REPLAYS one. No cloud handler
        mints an invoice number, renumbers a bill, or transitions its status —
        the rule ADR-014 set for kot.status, applied to money.

        The counter that produced invoice_number is edge-local and never syncs
        (sqlite invoice_sequence has no Postgres mirror and no AggregateType).
        Mirroring it would make the cloud a second writer of invoice numbers,
        which §33's "never generate duplicate invoice numbers" forbids.

        Rejects with 422 when the payload violates the ADR-016 rounding policy:
        components must sum to the grand total through round_off, |round_off|
        must not exceed 50 paise, and the total must settle in whole rupees.
        The same rule is a CHECK in both stores — this returns a reason rather
        than surfacing a driver-level constraint error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceEnvelope"
      responses:
        "200":
          description: Invoice stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          description: >
            An invoice with this number already exists for the outlet and
            series. Uniqueness is scoped to (outlet, series, number), never
            global — two outlets issuing FY26/.../000001 on one day is correct.
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /payments:
    post:
      summary: >
        Replay a tender taken at the edge (PaymentReceived / PaymentRefunded).
        Added at 0.4.0 (ADR-016).

        APPEND-ONLY (§53, docs/spec/payments.md §Conflict policy). This route
        never updates a captured payment: a void or refund arrives as a NEW
        payment carrying reverses_payment_id and a non-positive amount.
        Financial transactions are never last-write-wins.

        §34: a ₹2,000 bill settled as ₹500 cash + ₹1,000 UPI + ₹500 card
        arrives as three calls here, not one payment_method field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEnvelope"
      responses:
        "200":
          description: Payment stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /cash-shifts:
    post:
      summary: >
        Replay a cash shift opened at the edge (CashShiftOpened). Added at
        0.4.0 (ADR-016). Edge-authoritative: the drawer is at the outlet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashShiftEnvelope"
      responses:
        "200":
          description: Shift stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShift"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /cash-shifts/{shiftId}/close:
    post:
      summary: >
        Replay a shift close recorded at the edge (CashShiftClosed).

        Rejects with 422 a CLOSED shift that does not carry closed_at,
        expected, actual and variance — a register closed without its count can
        never be reconciled afterwards — or a non-zero variance with no reason,
        which §39 requires.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashShiftEnvelope"
      responses:
        "200":
          description: Shift close recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShift"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/send-to-kitchen:
    post:
      summary: >
        Replay the SENT_TO_KITCHEN transition.

        The kots array is a read-back convenience, not the ingest path. The edge
        generates tickets and replays each one through POST /orders/{id}/kots,
        which is the only route that creates a KOT (0.3.0, ADR-014). Returning
        them here as well lets a caller confirm the order's tickets in one round
        trip; it must never be treated as a second way to create them.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCommandEnvelope"
      responses:
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
        "200":
          description: KOTs generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/CanonicalOrder"
                  kots:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kot"

  /orders/{id}/confirm:
    post:
      summary: >
        Replay the DRAFT→CONFIRMED transition from the edge. Added at 0.2.5:
        the generic transition routes carry no payload, so confirmed_at had no
        way to reach the cloud and the column went unstamped by any production
        path. The edge is authoritative for order transactions (§50.1), so the
        timestamp is the moment the EDGE recorded — the cloud stores what it
        replays and never substitutes its own clock.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderConfirmEnvelope"
      responses:
        "200":
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "409":
          description: Illegal transition — the order was not in DRAFT
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /orders/{id}/cancel:
    post:
      summary: Replay an order cancellation (authorized, audited — see docs/spec/security-rbac.md)
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelEnvelope"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrder"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"

  /outlets/{outletId}/table-sessions:
    post:
      summary: >
        Replay a table seating opened at the edge. table_session is an
        edge-authoritative operational aggregate (ADR-011) and rides the same
        envelope ingest pattern as orders — there is no unwrapped REST write
        route for it. Envelope aggregate_type must be `table_session` and
        direction EDGE_TO_CLOUD.
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSessionEnvelope"
      responses:
        "201":
          description: Session replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
    get:
      summary: List open sessions for an outlet (read path, not envelope-wrapped)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      responses:
        "200":
          description: Open sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TableSession" }

  /outlets/{outletId}/table-sessions/{sessionId}:
    post:
      summary: >
        Replay a session state transition or close from the edge. The state
        machine is validated cloud-side; an illegal transition is rejected
        rather than applied.
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - $ref: "#/components/parameters/TableSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSessionEnvelope"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "409":
          description: Illegal state transition
        "422":
          $ref: "#/components/responses/EnvelopeRouteMismatch"
    get:
      summary: Fetch a session (read path, not envelope-wrapped)
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - $ref: "#/components/parameters/TableSessionId"
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSession"
        "404":
          description: Not found

  /menu/items/{itemId}/availability:
    post:
      summary: >
        Snooze or un-snooze a menu item. A catalog write like any other: bumps
        the outlet's config_version so the edge replaces the item on its next
        config pull (§50.1). Permission: menu.manage. Audited.
      parameters:
        - $ref: "#/components/parameters/MenuItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              additionalProperties: false
              properties:
                available: { type: boolean }
                reason:
                  type: string
                  maxLength: 280
                  description: Optional operator note, recorded on the audit event.
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "403":
          description: Missing menu.manage permission
        "404":
          description: No such item in the caller's tenant

  /auth/login:
    post:
      summary: Authenticate a user and open a session (Argon2id verify, §56)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, outlet_id]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                outlet_id: { type: string, format: uuid }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, principal]
                properties:
                  access_token: { type: string, description: short-lived }
                  refresh_token: { type: string, description: rotated on every use }
                  principal: { $ref: "#/components/schemas/AuthenticatedPrincipal" }
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401":
          description: Invalid or reused refresh token

  /auth/logout:
    post:
      summary: Revoke the current session's refresh token
      responses:
        "204":
          description: Logged out

  /users:
    get:
      summary: List users in the caller's tenant (permission user.manage)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }
    post:
      summary: Create a user (id is client-supplied UUIDv7, §74)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, email, full_name, password]
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }
                full_name: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /users/{id}/roles:
    put:
      summary: Replace a user's role assignments (permission user.manage, audited)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [id, role_id]
                properties:
                  id: { type: string, format: uuid }
                  role_id: { type: string, format: uuid }
                  outlet_id:
                    type: string
                    format: uuid
                    nullable: true
                    description: null = tenant-wide
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /roles:
    get:
      summary: List the tenant's roles and their permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }

  /outlets:
    get:
      summary: List outlets the caller may access (tenant-isolated)
      responses:
        "200":
          description: Outlets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Outlet" }

  /outlets/{outletId}/tables:
    get:
      summary: List the outlet's table definitions (configuration)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RestaurantTable" }
    post:
      summary: Create a table definition (permission table.manage; bumps config_version)
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestaurantTable" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantTable" }

  # --- compliance config write path (added 0.4.4, ADR-016) ----------------
  #
  # Eight routes, all mounted by compliance.Handler.Mount. Every one is
  # HUMAN-authenticated (auth.Authenticate + outlet.manage) and never mounted
  # under outlet.DeviceAuthenticate: these are management decisions, not device
  # replay, so they take no SyncEnvelope and are cloud→edge config in the
  # ADR-009/§50.1 sense. Each write bumps the outlet's config_version inside its
  # transaction, which is what makes it visible to a subsequent GET /sync/config.
  #
  # Known gap, deliberately recorded rather than papered over: these are gated on
  # `outlet.manage` because no `billing.manage` permission exists in the frozen
  # Permission enum. Splitting it is a semantic change and needs its own ADR.

  /outlets/{outletId}/compliance-versions:
    post:
      summary: >
        Open a compliance version — the effective-dated envelope every tax rule
        hangs off (permission outlet.manage; bumps config_version).
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, effective_from]
              properties:
                label: { type: string }
                effective_from: { type: string, format: date-time }
                notes: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceVersion" }
        "400": { description: Invalid input. }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Outlet not found in the caller's tenant. }

  /outlets/{outletId}/tax-profiles:
    post:
      summary: >
        Create a tax profile and, optionally, its rules in one transaction
        (permission outlet.manage; bumps config_version).
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, pricing_mode, is_default]
              properties:
                code: { type: string }
                name: { type: string }
                pricing_mode: { type: string, enum: [INCLUSIVE, EXCLUSIVE] }
                is_default: { type: boolean }
                rules:
                  type: array
                  description: >
                    Created atomically with the profile. A half-populated profile
                    is rejected before it reaches Postgres, never partially written.
                  items:
                    type: object
                    required: [compliance_version_id, component, rate_bps, effective_from]
                    properties:
                      compliance_version_id: { type: string, format: uuid }
                      component: { type: string, enum: [CGST, SGST, IGST, CESS] }
                      rate_bps:
                        type: integer
                        description: Basis points. Never a float — §66 rounding is exact.
                      effective_from: { type: string, format: date-time }
                      effective_to: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created, with the stored rules echoed back.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TaxProfile"
                  - type: object
                    required: [rules]
                    properties:
                      rules:
                        type: array
                        items: { $ref: "#/components/schemas/TaxRule" }
        "400": { description: Invalid input, including a half-populated rule set. }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Outlet not found in the caller's tenant. }

  /outlets/{outletId}/tax-profiles/{taxProfileId}/deactivate:
    post:
      summary: >
        Deactivate a tax profile (permission outlet.manage; bumps config_version).
        Effective-dated deactivation, not deletion — an issued invoice must remain
        reproducible against the profile that priced it (§31).
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - name: taxProfileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxProfile" }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Tax profile not found in the caller's tenant. }

  /outlets/{outletId}/invoice-series:
    post:
      summary: >
        Create an invoice numbering series (permission outlet.manage; bumps
        config_version).
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, prefix_template, reset_policy, padding_width]
              properties:
                code: { type: string }
                prefix_template:
                  type: string
                  description: >
                    Tokenised, e.g. "FY{FY}/{OUTLET}/". CAUTION: a non-NEVER
                    reset_policy combined with a prefix lacking the matching date
                    token yields duplicate numbers across periods. The UNIQUE
                    index catches it loudly at issue time, but it is not yet
                    validated here at config-write time.
                reset_policy: { type: string, enum: [NEVER, FY, MONTH, DAY] }
                padding_width: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
        "400": { description: Invalid input. }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Outlet not found in the caller's tenant. }

  /outlets/{outletId}/invoice-series/{seriesId}/deactivate:
    post:
      summary: >
        Deactivate an invoice series (permission outlet.manage; bumps
        config_version). Numbers already issued from it remain valid and
        reproducible.
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - name: seriesId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSeries" }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Invoice series not found in the caller's tenant. }

  /outlets/{outletId}/discount-definitions:
    post:
      summary: >
        Create a discount definition (permission outlet.manage; bumps
        config_version).
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, scope, method, requires_reason, effective_from]
              properties:
                code: { type: string }
                name: { type: string }
                scope: { type: string, enum: [LINE, BILL] }
                method: { type: string, enum: [PERCENT, AMOUNT] }
                value_bps:
                  type: integer
                  nullable: true
                  description: Basis points, for a PERCENT method.
                value_paise:
                  type: integer
                  nullable: true
                  description: Integer paise, for an AMOUNT method. Never a float.
                max_discount_paise: { type: integer, nullable: true }
                required_permission:
                  type: string
                  nullable: true
                  description: >
                    An additional permission the applying user must hold, beyond
                    the one that created this definition.
                requires_reason: { type: boolean }
                effective_from: { type: string, format: date-time }
                effective_to: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountDefinition" }
        "400":
          description: >
            Invalid input, including a half-populated definition — e.g. a
            PERCENTAGE method carrying value_paise, or neither value set.
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Outlet not found in the caller's tenant. }

  /outlets/{outletId}/discount-definitions/{discountId}/deactivate:
    post:
      summary: >
        Deactivate a discount definition (permission outlet.manage; bumps
        config_version). Discounts already applied to issued invoices are
        unaffected.
      parameters:
        - $ref: "#/components/parameters/OutletId"
        - name: discountId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountDefinition" }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Discount definition not found in the caller's tenant. }

  /outlets/{outletId}/fiscal-profile:
    post:
      summary: >
        Set the outlet's fiscal identity — the legal name, GSTIN and address that
        print on every GST invoice (permission outlet.manage; bumps
        config_version).

        Effective-dated and append-only in effect: setting a new profile does not
        rewrite the one a past invoice was issued under, because §31 requires a
        reprint to reproduce the original document.
      parameters:
        - $ref: "#/components/parameters/OutletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [legal_name, trade_name, address_line1, city, state_code,
                 state_name, pincode, gstin, effective_from]
              properties:
                legal_name: { type: string }
                trade_name: { type: string }
                address_line1: { type: string }
                address_line2: { type: string, nullable: true }
                city: { type: string }
                state_code:
                  type: string
                  description: >
                    Drives the CGST/SGST vs IGST split — place of supply is
                    computed from it, not chosen by the caller.
                state_name: { type: string }
                pincode: { type: string }
                gstin: { type: string }
                fssai_number: { type: string, nullable: true }
                invoice_footer_text: { type: string, nullable: true }
                effective_from: { type: string, format: date-time }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutletFiscalProfile" }
        "400": { description: Invalid input, including a malformed GSTIN. }
        "401": { description: Caller is not authenticated. }
        "403": { description: Caller lacks outlet.manage on this outlet. }
        "404": { description: Outlet not found in the caller's tenant. }

  /menu/categories:
    get:
      summary: List menu categories for an outlet
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuCategory" }
    post:
      summary: Create a category (permission menu.manage; bumps config_version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuCategory" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuCategory" }

  /menu/items:
    get:
      summary: List menu items for an outlet
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
    post:
      summary: Create a menu item (permission menu.manage; bumps config_version)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItem" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }

  /stations:
    get:
      summary: List stations for an outlet (permission menu.manage)
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Station" }
    post:
      summary: >
        Create a station (permission menu.manage; bumps config_version). Added
        at 0.3.0 (ADR-014). Config, cloud→edge — the edge never creates one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outlet_id, code, name]
              properties:
                id:
                  type: string
                  format: uuid
                  description: App-generated UUIDv7 (§74). The server never mints it.
                outlet_id: { type: string, format: uuid }
                code:
                  type: string
                  description: Stable machine code, unique per outlet — not globally.
                name: { type: string }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses:
        "201":
          description: Station created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "409":
          description: A station with that code already exists for this outlet

  /menu/items/{itemId}/stations:
    put:
      summary: >
        Replace an item's station routing (permission menu.manage; bumps
        config_version). Added at 0.3.0 (ADR-014).

        PUT, not POST: routing is a set, the edge replaces config wholesale
        rather than merging (§50.1), and an append-only route would leave no way
        to stop an item printing at a station it no longer belongs to.
      parameters:
        - $ref: "#/components/parameters/MenuItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station_ids]
              properties:
                station_ids:
                  type: array
                  description: >
                    May contain more than one — an item can route to several
                    stations (docs/spec/kitchen.md §Stations). An empty array
                    means the item produces no ticket, which is legitimate for
                    a non-production line such as a service charge.
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Routing replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItemStation" }

  /printers:
    get:
      summary: List printers for an outlet (permission outlet.manage)
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Printers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Printer" }
    post:
      summary: >
        Register a printer (permission outlet.manage; bumps config_version).
        Added at 0.3.0 (ADR-014).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outlet_id, name, connection_kind, address, paper_width_mm]
              properties:
                id:
                  type: string
                  format: uuid
                  description: App-generated UUIDv7 (§74).
                outlet_id: { type: string, format: uuid }
                name: { type: string }
                connection_kind: { $ref: "#/components/schemas/PrinterConnectionKind" }
                address: { type: string }
                paper_width_mm: { type: integer, enum: [58, 80] }
                is_active: { type: boolean }
      responses:
        "201":
          description: Printer registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Printer" }
        "409":
          description: A printer with that name already exists for this outlet

  /stations/{stationId}/printers:
    put:
      summary: >
        Replace a station's printer routing (permission outlet.manage; bumps
        config_version). Added at 0.3.0 (ADR-014). Tandoor → Printer A, Bar →
        Printer B (docs/spec/hardware-printing.md §Printing). PUT for the same
        reason item routing is: config is replaced, not merged.
      parameters:
        - $ref: "#/components/parameters/StationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printer_ids]
              properties:
                printer_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Routing replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StationPrinter" }

  /sync/config:
    get:
      summary: >
        Pull authorized configuration newer than since_version (cloud→edge,
        §50.1). Returns only CLOUD_TO_EDGE aggregates; the edge replaces each
        aggregate wholesale rather than merging.
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: since_version
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Configuration bundle
          content:
            application/json:
              schema:
                type: object
                required:
                  [config_version, users, tables, categories, items,
                   stations, item_stations, printers, station_printers,
                   compliance_versions, tax_profiles, tax_rules,
                   invoice_series, discount_definitions, fiscal_profile,
                   device_credentials]
                properties:
                  config_version: { type: integer }
                  device_credentials:
                    type: array
                    description: >
                      Argon2id VERIFIERS for devices enrolled at this outlet,
                      added at 0.4.3 (ADR-017 amendment). Ships for the same
                      reason `users` does: so a LAN handshake can be verified
                      with the uplink down. A kitchen screen reconnecting during
                      a WAN outage must still authenticate, because ticket
                      visibility is a core operation.

                      The PLAINTEXT token never appears here or anywhere else
                      after enrollment. Revoked and expired credentials ARE
                      included — the edge learns a credential is dead by syncing
                      it, not by its absence, which while offline is
                      indistinguishable from "not yet synced".
                    items:
                      type: object
                      required:
                        [credential_id, device_id, tenant_id, outlet_id,
                         credential_hash, device_kind, config_version,
                         schema_version]
                      properties:
                        credential_id: { type: string, format: uuid }
                        device_id: { type: string, format: uuid }
                        tenant_id: { type: string, format: uuid }
                        outlet_id: { type: string, format: uuid }
                        credential_hash:
                          type: string
                          description: >
                            Argon2id encoded string — a verifier to check a
                            presented token against, never a bearer token.
                            Named credential_hash rather than token_hash for
                            exactly that reason.
                        device_kind:
                          type: string
                          enum: [POS, KDS, WAITER, PRINTER_BRIDGE]
                        revoked_at: { type: string, format: date-time, nullable: true }
                        expires_at: { type: string, format: date-time, nullable: true }
                        config_version: { type: integer }
                        schema_version: { type: integer, enum: [1] }
                  compliance_versions:
                    type: array
                    items: { $ref: "#/components/schemas/ComplianceVersion" }
                  tax_profiles:
                    type: array
                    items: { $ref: "#/components/schemas/TaxProfile" }
                  tax_rules:
                    type: array
                    description: >
                      Child rows of tax_profile, shipped flat in the bundle as
                      item_stations and station_printers already are.
                    items: { $ref: "#/components/schemas/TaxRule" }
                  invoice_series:
                    type: array
                    description: >
                      Series DEFINITIONS. The counters stay at the outlet — an
                      edge that pulls config never receives or reports a next
                      number, because the cloud is not a writer of one (§33).
                    items: { $ref: "#/components/schemas/InvoiceSeries" }
                  discount_definitions:
                    type: array
                    items: { $ref: "#/components/schemas/DiscountDefinition" }
                  fiscal_profile:
                    description: >
                      The outlet's current seller identity, or null before one
                      is configured — in which case the edge cannot issue a
                      compliant GST invoice and must say so rather than print
                      an incomplete bill (§33).
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/OutletFiscalProfile"
                  users:
                    type: array
                    description: >
                      Credential material is included ONLY on this endpoint and
                      ONLY as Argon2id hashes, so the edge can authenticate
                      offline. The edge stores it in an encrypted-at-rest
                      database (ADR-011). Never returned by /users.
                    items: { $ref: "#/components/schemas/EdgeUserCacheEntry" }
                  # `roles` was removed at 0.2.2 — the only non-additive change
                  # in that bump. The edge has no role table by design;
                  # permissions arrive pre-flattened on each user entry, so the
                  # field promised storage that does not exist and the sync
                  # worker parsed then discarded it.
                  tables:
                    type: array
                    items: { $ref: "#/components/schemas/RestaurantTable" }
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/MenuCategory" }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MenuItem" }
                  # Added at 0.3.0 (ADR-014). Growing the `required` list is the
                  # one non-additive part of this bump: the edge sync worker is
                  # the sole consumer and is updated in the same milestone, so a
                  # tolerated-absence field would only hide a half-configured
                  # kitchen until the first ticket failed to route.
                  stations:
                    type: array
                    items: { $ref: "#/components/schemas/Station" }
                  item_stations:
                    type: array
                    description: Item → station routing; an item may appear more than once.
                    items: { $ref: "#/components/schemas/MenuItemStation" }
                  printers:
                    type: array
                    items: { $ref: "#/components/schemas/Printer" }
                  station_printers:
                    type: array
                    items: { $ref: "#/components/schemas/StationPrinter" }

components:
  responses:
    EnvelopeRouteMismatch:
      description: >
        The envelope's aggregate_type or direction does not match the route.
        Each ingest route pins its aggregate, and §50.1 pins that aggregate's
        direction, so a mismatch is a protocol violation and is rejected —
        never coerced into the route's expected values.
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: envelope_route_mismatch }
              message: { type: string }

  parameters:
    MenuItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    KotId:
      name: kotId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    StationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TableSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OutletId:
      name: outletId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SyncDirection:
      type: string
      enum: [EDGE_TO_CLOUD, CLOUD_TO_EDGE]

    AggregateType:
      type: string
      description: >
        Milestone 2 added station and printer (config, cloud→edge). Deliberately
        absent: print_job and kot_status_history are edge-local, and
        refresh_token is cloud-only — listing any of them would promise a sync
        direction for something that never crosses the boundary.
      enum:
        [order, kot, payment, table_session, menu_item, app_user, role,
         restaurant_table, station, printer]

    SyncEnvelope:
      type: object
      description: >
        The single wire shape for replaying an edge-authoritative aggregate to
        the cloud (§50.1, ADR-009). Mirrors src/types/sync.ts SyncEnvelopeSchema
        and go/sync.go SyncEnvelope. It exists on the wire because record_id,
        device_id and version are edge-owned facts that the payload types do
        not carry — CanonicalOrder has no version field by design; the envelope
        is the concurrency token's home. There is no unwrapped write route for
        any EDGE_TO_CLOUD aggregate.
      required:
        [record_id, tenant_id, outlet_id, device_id, aggregate_type, direction,
         created_at, updated_at, version, sync_status, payload]
      properties:
        record_id:
          type: string
          format: uuid
          description: The wrapped entity's own edge-assigned UUIDv7. The cloud never mints it.
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        aggregate_type: { $ref: "#/components/schemas/AggregateType" }
        direction: { $ref: "#/components/schemas/SyncDirection" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          type: integer
          description: Optimistic concurrency / config version, per-aggregate policy (sync.md §51).
        sync_status: { type: string, enum: [PENDING, SYNCED, FAILED] }
        payload: { type: object }

    OrderEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/CanonicalOrder" }

    OrderItemEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/OrderItem" }

    OrderCommandEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              additionalProperties: false

    OrderConfirmEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [confirmed_at]
              additionalProperties: false
              properties:
                confirmed_at:
                  type: string
                  format: date-time
                  description: When the EDGE recorded the confirmation, not when the cloud received it.

    OrderCancelEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [order] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string }

    KotEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [kot] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/Kot" }

    Invoice:
      type: object
      description: >
        A GST invoice (§33). Split bills are N invoices over one order sharing
        split_group_id — each part is independently numbered and independently
        payable, because that is what the customer physically receives. There
        is deliberately no BillSplit entity.

        tax_snapshot and fiscal_profile are the rules and seller identity AS
        THEY STOOD AT ISSUE TIME (§31), so reprinting a six-month-old bill
        after a rate or GSTIN change reproduces the original document rather
        than recomputing it.
      required:
        [id, outlet_id, order_id, series_id, invoice_number, invoice_date,
         business_date, status, place_of_supply_state_code, lines,
         subtotal_paise, taxable_value_paise, grand_total_paise,
         compliance_version_id, tax_snapshot, fiscal_profile, channel,
         tax_liability_party, created_by_user_id, created_at, updated_at,
         version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        split_group_id: { type: string, format: uuid, nullable: true }
        split_index: { type: integer, minimum: 1, default: 1 }
        split_count: { type: integer, minimum: 1, default: 1 }
        series_id: { type: string, format: uuid }
        invoice_number:
          type: string
          description: >
            Issued by the edge-local counter. Unique per (outlet, series),
            never globally.
        invoice_date: { type: string, format: date-time }
        business_date:
          type: string
          description: Outlet-local YYYY-MM-DD; the business day may cross midnight.
        status: { type: string, enum: [ISSUED, CANCELLED] }
        cancelled_reason: { type: string, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        customer_name: { type: string, nullable: true }
        customer_phone: { type: string, nullable: true }
        customer_gstin: { type: string, nullable: true }
        place_of_supply_state_code: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        subtotal_paise: { type: integer }
        discount_paise: { type: integer, default: 0 }
        taxable_value_paise: { type: integer }
        cgst_paise: { type: integer, default: 0 }
        sgst_paise: { type: integer, default: 0 }
        igst_paise: { type: integer, default: 0 }
        cess_paise: { type: integer, default: 0 }
        round_off_paise:
          type: integer
          minimum: -50
          maximum: 50
          default: 0
          description: >
            ADR-016: rounding to the nearest rupee can never move a total by
            more than half a rupee. A larger value means round-off is absorbing
            an arithmetic error.
        grand_total_paise:
          type: integer
          multipleOf: 100
          description: >
            ADR-016: equals taxable_value + cgst + sgst + igst + cess +
            round_off, and settles in whole rupees.
        compliance_version_id: { type: string, format: uuid }
        tax_snapshot: { type: object, additionalProperties: true }
        fiscal_profile: { type: object, additionalProperties: true }
        channel: { type: string }
        tax_liability_party: { type: string, enum: [RESTAURANT, ECO] }
        eco_operator_name: { type: string, nullable: true }
        eco_operator_gstin: { type: string, nullable: true }
        supply_classification: { type: string, nullable: true }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    InvoiceLine:
      type: object
      description: >
        order_item_id is what makes the split conservation property checkable:
        across a split group every order line must appear exactly once in total
        quantity — no loss, no duplication, no double-tax.
      required:
        [id, invoice_id, order_item_id, line_no, description, quantity,
         unit_price_paise, gross_paise, taxable_value_paise, tax_profile_id,
         total_paise, schema_version]
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        line_no: { type: integer, minimum: 1 }
        description:
          type: string
          description: Snapshot at issue time — never re-read from the live menu.
        hsn_sac: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unit_price_paise: { type: integer }
        gross_paise: { type: integer }
        discount_paise: { type: integer, default: 0 }
        taxable_value_paise: { type: integer }
        tax_profile_id: { type: string, format: uuid }
        cgst_rate_bps: { type: integer, minimum: 0, default: 0 }
        cgst_paise: { type: integer, default: 0 }
        sgst_rate_bps: { type: integer, minimum: 0, default: 0 }
        sgst_paise: { type: integer, default: 0 }
        igst_rate_bps: { type: integer, minimum: 0, default: 0 }
        igst_paise: { type: integer, default: 0 }
        cess_rate_bps: { type: integer, minimum: 0, default: 0 }
        cess_paise: { type: integer, default: 0 }
        total_paise: { type: integer }
        schema_version: { type: integer, enum: [1] }

    Payment:
      type: object
      description: >
        One tender (§34). APPEND-ONLY: a void or refund is a new Payment
        carrying reverses_payment_id and a non-positive amount, never an update.

        status is the capture lifecycle of THIS tender, deliberately distinct
        from CanonicalOrder.payment_status, which is the order's overall
        standing. An order can sit at PARTIALLY_PAID while one tender is
        CAPTURED, another FAILED and a third PENDING.
      required:
        [id, outlet_id, order_id, method, status, amount_paise,
         created_by_user_id, created_at, updated_at, version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        cash_shift_id: { type: string, format: uuid, nullable: true }
        method:
          type: string
          enum: [CASH, UPI, CREDIT_CARD, DEBIT_CARD, WALLET, GIFT_CARD,
                 LOYALTY_POINTS, BANK_TRANSFER, AGGREGATOR_PAID, HOUSE_ACCOUNT,
                 CREDIT]
        status:
          type: string
          enum: [PENDING, CAPTURED, FAILED, VOIDED, REFUNDED]
          description: >
            Milestone 3 delivers CASH and split tenders only; gateway capture
            lands in Milestone 7. The states are modelled now so a Razorpay
            attempt has somewhere to go without a contract change.
        amount_paise:
          type: integer
          description: Negative on a reversal row.
        tendered_paise:
          type: integer
          nullable: true
          description: >
            CASH only — set on any other method it corrupts the shift's
            expected-cash derivation.
        change_paise: { type: integer, nullable: true }
        reference: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        reverses_payment_id: { type: string, format: uuid, nullable: true }
        captured_at: { type: string, format: date-time, nullable: true }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/PaymentAllocation" }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    PaymentAllocation:
      type: object
      description: >
        How one tender settles against one or more invoices. This is what lets
        split payment and split bill compose: one card swipe can settle two
        parts of a split group, and one part can be settled by three tenders.
      required: [id, payment_id, invoice_id, amount_paise, schema_version]
      properties:
        id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        amount_paise: { type: integer }
        schema_version: { type: integer, enum: [1] }

    CashShift:
      type: object
      description: >
        Cashier-specific register (§39). Expected cash is derived from
        movements; actual is counted by a human; variance is the difference and
        requires a reason.
      required:
        [id, outlet_id, device_id, cashier_user_id, status, opened_at,
         opening_cash_paise, business_date, created_at, updated_at, version,
         schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        cashier_user_id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CLOSED] }
        opened_at: { type: string, format: date-time }
        opening_cash_paise: { type: integer, minimum: 0 }
        closed_at: { type: string, format: date-time, nullable: true }
        expected_cash_paise: { type: integer, nullable: true }
        actual_cash_paise: { type: integer, nullable: true }
        variance_paise: { type: integer, nullable: true }
        variance_reason:
          type: string
          nullable: true
          description: Required by §39 whenever variance_paise is non-zero.
        business_date: { type: string }
        movements:
          type: array
          items: { $ref: "#/components/schemas/CashMovement" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    CashMovement:
      type: object
      description: Append-only — a correction is another movement, never an edit.
      required:
        [id, cash_shift_id, kind, amount_paise, created_by_user_id, created_at,
         schema_version]
      properties:
        id: { type: string, format: uuid }
        cash_shift_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [OPENING_FLOAT, CASH_SALE, CASH_REFUND, PAID_IN, PAID_OUT]
        amount_paise:
          type: integer
          description: "Signed: PAID_OUT and CASH_REFUND are negative."
        reason:
          type: string
          nullable: true
          description: Required for PAID_IN and PAID_OUT.
        payment_id: { type: string, format: uuid, nullable: true }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }

    TaxProfile:
      type: object
      description: >
        CONFIG (cloud→edge). §31: every rate in the product resolves through a
        profile — no percentage is scattered onto a menu item.
      required:
        [id, outlet_id, code, name, pricing_mode, is_default, is_active,
         config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        code:
          type: string
          description: Stable machine code, unique per outlet, never global.
        name: { type: string }
        pricing_mode: { type: string, enum: [INCLUSIVE, EXCLUSIVE] }
        is_default: { type: boolean }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    TaxRule:
      type: object
      description: >
        A component rate inside a profile, effective-dated. Child row travelling
        in its parent's config bundle — not an aggregate of its own.
      required:
        [id, tax_profile_id, compliance_version_id, component, rate_bps,
         effective_from, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        tax_profile_id: { type: string, format: uuid }
        compliance_version_id: { type: string, format: uuid }
        component: { type: string, enum: [CGST, SGST, IGST, CESS] }
        rate_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: >
            Integer basis points, never a float: 2.5% = 250. A rate that
            multiplies money obeys the same no-floating-point rule money does.
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    ComplianceVersion:
      type: object
      description: >
        The versioned ruleset an invoice pins itself to, so historical bills
        stay reproducible after the rules change (§31).
      required: [id, outlet_id, label, effective_from, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        label: { type: string }
        effective_from: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    InvoiceSeries:
      type: object
      description: >
        The series DEFINITION only. The counter that issues the next number is
        edge-local, has no representation here, and never syncs (§33).
      required:
        [id, outlet_id, code, prefix_template, reset_policy, padding_width,
         is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        code: { type: string }
        prefix_template:
          type: string
          description: "Tokens: {FY} {YYYY} {MM} {DD} {OUTLET}."
        reset_policy: { type: string, enum: [NEVER, FY, MONTH, DAY] }
        padding_width: { type: integer, minimum: 1, maximum: 12 }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    DiscountDefinition:
      type: object
      description: >
        Exactly one of value_bps and value_paise is set, decided by method. A
        half-populated row asks a question with no defined answer — "20% or
        ₹50?" — so both stores CHECK it and Zod refines it.
      required:
        [id, outlet_id, code, name, scope, method, requires_reason, is_active,
         effective_from, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        scope: { type: string, enum: [LINE, BILL] }
        method: { type: string, enum: [PERCENT, AMOUNT] }
        value_bps: { type: integer, minimum: 0, maximum: 10000, nullable: true }
        value_paise: { type: integer, minimum: 0, nullable: true }
        max_discount_paise: { type: integer, nullable: true }
        required_permission: { type: string, nullable: true }
        requires_reason: { type: boolean }
        is_active: { type: boolean }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    OutletFiscalProfile:
      type: object
      description: >
        The seller identity printed on a GST invoice (§33). Effective-dated: a
        reprinted historical invoice carries the identity current when it was
        issued, not today's.
      required:
        [id, outlet_id, legal_name, trade_name, address_line1, city, state_code,
         state_name, pincode, gstin, effective_from, config_version,
         schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        legal_name: { type: string }
        trade_name: { type: string }
        address_line1: { type: string }
        address_line2: { type: string, nullable: true }
        city: { type: string }
        state_code: { type: string }
        state_name: { type: string }
        pincode: { type: string }
        gstin: { type: string }
        fssai_number: { type: string, nullable: true }
        invoice_footer_text: { type: string, nullable: true }
        effective_from: { type: string, format: date-time }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    InvoiceEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [invoice] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/Invoice" }

    PaymentEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [payment] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/Payment" }

    CashShiftEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [cash_shift] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/CashShift" }

    KotStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [kot] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload:
              type: object
              required: [status, changed_at, changed_by_device_id]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/KotStatus" }
                changed_at:
                  type: string
                  format: date-time
                  description: >
                    When the EDGE recorded the transition, not when the cloud
                    received it. Kitchen timing analytics are the point of this
                    route; an outlet syncing hourly would otherwise report every
                    ticket as prepared in the same instant.
                changed_by_device_id: { type: string, format: uuid }

    TableSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEnvelope"
        - type: object
          properties:
            aggregate_type: { enum: [table_session] }
            direction: { enum: [EDGE_TO_CLOUD] }
            payload: { $ref: "#/components/schemas/TableSession" }

    RoleCode:
      type: string
      description: docs/spec/security-rbac.md §Roles
      enum:
        [
          PLATFORM_SUPER_ADMIN,
          ORGANISATION_OWNER,
          BRAND_ADMIN,
          REGIONAL_MANAGER,
          OUTLET_MANAGER,
          ACCOUNTANT,
          INVENTORY_MANAGER,
          PURCHASE_MANAGER,
          CHEF,
          KITCHEN_STAFF,
          CAPTAIN,
          WAITER,
          CASHIER,
          DELIVERY_STAFF,
          AUDITOR,
        ]

    Permission:
      type: string
      description: Milestone 1 permission set; extended per milestone.
      enum:
        [
          order.create,
          order.modify,
          order.cancel,
          order.void,
          menu.manage,
          table.manage,
          outlet.manage,
          user.manage,
        ]

    Role:
      type: object
      required: [id, tenant_id, code, name, permissions, schema_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/RoleCode" }
        name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        schema_version: { type: integer, enum: [1] }

    RoleAssignment:
      type: object
      required: [id, role_id, role_code]
      properties:
        id: { type: string, format: uuid }
        role_id: { type: string, format: uuid }
        role_code: { $ref: "#/components/schemas/RoleCode" }
        outlet_id:
          type: string
          format: uuid
          nullable: true
          description: null = tenant-wide assignment

    AppUser:
      type: object
      description: >
        Wire shape only. Carries no credential material — password_hash and
        pin_hash never leave the database (ADR-011).
      required: [id, tenant_id, email, full_name, is_active, roles, config_version, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        is_active: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        config_version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }

    EdgeUserCacheEntry:
      type: object
      description: >
        Returned only by /sync/config, only over TLS, only to an enrolled edge
        node. Stored in the encrypted-at-rest edge database (ADR-011).
      required: [id, tenant_id, outlet_id, email, full_name, password_hash, is_active, permissions, config_version, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        password_hash: { type: string, description: Argon2id encoded string; never logged }
        pin_hash: { type: string, nullable: true }
        is_active: { type: boolean }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        config_version: { type: integer }
        updated_at:
          type: string
          format: date-time
          description: >
            Added at 0.2.2. sqlite app_user.updated_at is NOT NULL, so without
            this the edge had to synthesize a wall-clock value on every pull.
            Not used for staleness comparison — config_version drives
            replace-or-ignore.
        schema_version:
          type: integer
          enum: [1]
          description: >
            Added to the required list at 0.3.1 (ADR-015). Every sibling wire
            type carries schema_version; this one did not, so the Go and
            TypeScript mirrors written at 0.3.1 would have drifted from this
            schema on their first field. Reconciled here rather than dropped
            from the mirrors, which would have left this type as the only
            unversioned shape on the wire.

    AuthenticatedPrincipal:
      type: object
      required: [user_id, tenant_id, outlet_id, full_name, permissions, authenticated_offline, schema_version]
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        full_name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        authenticated_offline:
          type: boolean
          description: true when verified against the edge user cache
        schema_version: { type: integer, enum: [1] }

    Outlet:
      type: object
      required: [id, brand_id, name, timezone, config_version]
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, example: Asia/Kolkata }
        config_version: { type: integer }

    RestaurantTable:
      type: object
      description: Pure configuration; live state lives in TableSession (ADR-011).
      required: [id, outlet_id, section, label, seat_count, is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        section: { type: string }
        label: { type: string, example: T4 }
        seat_count: { type: integer, minimum: 1 }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    TableSession:
      type: object
      description: Operational aggregate; edge-authoritative, replayed edge→cloud.
      required: [id, outlet_id, table_id, state, guest_count, opened_at, version, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        table_id: { type: string, format: uuid }
        state:
          type: string
          enum: [OCCUPIED, ORDERED, KOT_SENT, FOOD_READY, BILL_REQUESTED, PAYMENT_PENDING, PAID, DIRTY, CLOSED]
        current_order_id: { type: string, format: uuid, nullable: true }
        guest_count: { type: integer, minimum: 1 }
        opened_by_user_id: { type: string, format: uuid, nullable: true }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }

    MenuCategory:
      type: object
      required: [id, outlet_id, name, sort_order, config_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        config_version: { type: integer }

    MenuItem:
      type: object
      # Drifted from the canonical TS/Go types for three fields until 0.4.6:
      # tax_profile_id (added 0.4.2), hsn_sac (added 0.4.5) and schema_version
      # (present since the type was written). Found by the edge/sync build fix,
      # not by a check — nothing machine-compares this document to
      # src/types/*.ts or go/*.go, so it can drift again tomorrow and nothing
      # goes red. See the ADR-016 0.4.4 addendum's note on that gap.
      required:
        [id, outlet_id, category_id, name, base_price_paise, is_available,
         config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name: { type: string }
        base_price_paise: { type: integer, description: integer paise, never float }
        is_available: { type: boolean }
        tax_profile_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Added 0.4.2. Which TaxProfile prices this item; null means "use the
            outlet's default profile", which keeps a single-rate restaurant
            configuration-free. An INPUT to resolution, never a substitute for
            the snapshot — invoice_line stores what was applied, so re-pointing
            an item tomorrow never rewrites a bill issued today (§31).
        hsn_sac:
          type: string
          nullable: true
          description: >
            Added 0.4.5. The HSN (goods) or SAC (services) code a GST tax
            invoice must print for this item's lines. On the item rather than
            the tax profile because HSN/SAC classifies what is sold while a
            profile classifies how it is rated — prepared food (SAC 9963) and
            packaged water (HSN 2201) routinely share one 5% profile.

            Nullable, and not a licence to print a blank code: an invoice must
            not issue with a line whose hsn_sac is null, and the edge rejects
            issuance naming the offending items. No fallback code is
            substituted — a wrong HSN is worse than a missing one because it
            looks configured.
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    OrderType:
      type: string
      enum: [DINE_IN, TAKEAWAY, DELIVERY, AGGREGATOR, QR, ROOM_SERVICE, CATERING]

    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SENT_TO_KITCHEN, PREPARING, READY, SERVED, BILLED, PAID, CLOSED, CANCELLED]

    OrderItemModifier:
      type: object
      required: [modifier_id, group_name, option_name, price_delta_paise]
      properties:
        modifier_id: { type: string, format: uuid }
        group_name: { type: string }
        option_name: { type: string }
        price_delta_paise: { type: integer }

    OrderItem:
      type: object
      required: [id, menu_item_id, quantity, unit_price_paise, line_total_paise]
      properties:
        id: { type: string, format: uuid }
        menu_item_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid, nullable: true }
        quantity: { type: integer, minimum: 1 }
        unit_price_paise: { type: integer }
        line_total_paise: { type: integer }
        modifiers:
          type: array
          items: { $ref: "#/components/schemas/OrderItemModifier" }
        notes: { type: string, nullable: true }

    CanonicalOrder:
      type: object
      description: See docs/spec/ordering.md §Canonical order model.
      required:
        - holler_order_id
        - source
        - outlet_id
        - order_type
        - status
        - items
        - subtotal_paise
        - total_paise
        - payment_status
        - timestamps
        - schema_version
      properties:
        holler_order_id: { type: string, format: uuid }
        external_order_id: { type: string, nullable: true }
        source:
          type: string
          enum: [POS, QR, AGGREGATOR_ZOMATO, AGGREGATOR_SWIGGY, DIRECT]
        outlet_id: { type: string, format: uuid }
        order_type: { $ref: "#/components/schemas/OrderType" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        table_id: { type: string, format: uuid, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal_paise: { type: integer }
        discount_paise: { type: integer, default: 0 }
        packaging_paise: { type: integer, default: 0 }
        delivery_charge_paise: { type: integer, default: 0 }
        taxes_paise: { type: integer, default: 0 }
        aggregator_discount_paise: { type: integer, default: 0 }
        merchant_discount_paise: { type: integer, default: 0 }
        total_paise: { type: integer }
        payment_status:
          type: string
          enum: [UNPAID, PARTIALLY_PAID, PAID, REFUNDED]
        payment_source: { type: string, nullable: true }
        preparation_time_minutes: { type: integer, nullable: true }
        timestamps:
          type: object
          required: [created_at, updated_at]
          properties:
            created_at: { type: string, format: date-time }
            confirmed_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }
        source_payload:
          type: object
          nullable: true
          description: Raw external payload, audit only.
        schema_version:
          type: integer
          enum: [1]

    # Milestone 2 config aggregates (0.3.0, ADR-014). Mirrors
    # src/types/station.ts, src/types/printer.ts and their Go structs.
    Station:
      type: object
      description: >
        A production destination — docs/spec/kitchen.md §Stations. CONFIG,
        cloud→edge. The live ticket at a station is a Kot, which is
        edge-authoritative; that split mirrors RestaurantTable/TableSession.
      required: [id, outlet_id, code, name, sort_order, is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        code:
          type: string
          description: >
            Stable machine code (MAIN_KITCHEN, TANDOOR, ...), unique per outlet
            and never globally. Kot.station stores this rather than a station
            id, so a ticket already on the pass survives a rename.
        name: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    MenuItemStation:
      type: object
      description: >
        Item → station routing. A join row rather than a column on MenuItem
        because an item may route to more than one station.
      required: [menu_item_id, station_id, config_version, schema_version]
      properties:
        menu_item_id: { type: string, format: uuid }
        station_id: { type: string, format: uuid }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    PrinterConnectionKind:
      type: string
      description: >
        Transport, not vendor. Brand differences are edge/printer adapter
        details. Label printers are excluded from Milestone 2 (§81).
      enum: [ESCPOS_NETWORK, ESCPOS_USB, ESCPOS_BLUETOOTH]

    Printer:
      type: object
      description: CONFIG, cloud→edge — docs/spec/hardware-printing.md.
      required:
        [id, outlet_id, name, connection_kind, address, paper_width_mm,
         is_active, config_version, schema_version]
      properties:
        id: { type: string, format: uuid }
        outlet_id: { type: string, format: uuid }
        name: { type: string, description: Unique per outlet, not globally. }
        connection_kind: { $ref: "#/components/schemas/PrinterConnectionKind" }
        address:
          type: string
          description: >
            Interpreted only by the matching adapter — host:port, USB path or MAC.
        paper_width_mm: { type: integer, enum: [58, 80] }
        is_active: { type: boolean }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    StationPrinter:
      type: object
      description: >
        Station → printer routing. Many-to-many both ways: one printer can serve
        two stations, and a station can fan out to two printers.
      required: [station_id, printer_id, config_version, schema_version]
      properties:
        station_id: { type: string, format: uuid }
        printer_id: { type: string, format: uuid }
        config_version: { type: integer }
        schema_version: { type: integer, enum: [1] }

    # DELIBERATELY ABSENT: PrintJob. The spool is edge-local — it crosses no
    # boundary, so it gets no wire schema and no route. The POS reads it across
    # the Tauri boundary using the TypeScript type in src/types/printer.ts.

    KotStatus:
      type: string
      description: >
        KOT lifecycle — docs/spec/kitchen.md §KOT. Extracted from the inline
        Kot.status enum at 0.3.0 so the status-transition route references one
        definition rather than repeating the list.
      enum: [NEW, ACKNOWLEDGED, PREPARING, READY, SERVED, CANCELLED]

    Kot:
      type: object
      description: One row per station ticket — see docs/spec/kitchen.md §12.
      required: [id, order_id, station, sequence, status, items, created_by_device_id, created_at, updated_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        station: { type: string }
        sequence: { type: integer }
        status: { $ref: "#/components/schemas/KotStatus" }
        items:
          type: array
          items:
            type: object
            properties:
              order_item_id: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              modifiers:
                type: array
                items: { type: string }
              notes: { type: string, nullable: true }
        created_by_device_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        schema_version:
          type: integer
          enum: [1]
