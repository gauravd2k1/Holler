name: CI

# STYLE CHECKS DO NOT SHARE A JOB WITH TESTS. Steps in a GitHub Actions job
# run fail-fast, so a formatter or linter placed in front of a test suite does
# not report a style problem -- it WITHDRAWS THE VERDICT from every test
# behind it, and the run shows one red job either way.
#
# That is not hypothetical here. `cargo fmt --check` sat in front of `cargo
# test` in the `edge` job and was red, so four consecutive pushes produced no
# Rust test result at all and an M4 acceptance criterion was recorded UNPROVEN
# because nothing had ever run to prove it. A second breakage (clippy, in
# edge/printer) was hiding behind the first the entire time.
#
# The rule, generalised: independent checks in sequence inside one fail-fast
# job make the later ones unobservable whenever an earlier one breaks. Style
# (fmt, clippy, vet, lint, typecheck) goes in a `*-style` job; tests and
# builds go in their own. Both still gate the merge. Neither can mask the
# other.
#
# Adding a check? Ask what it makes invisible when it fails.

on:
  push:
  pull_request:

jobs:
  # Style only, and deliberately WITHOUT the postgres service the `backend` job
  # needs: `go vet` used to be the first step there, in front of migrate and
  # the whole suite. Nothing about vet requires a database, and nothing about
  # the suite should be unobservable because vet failed.
  backend-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: cd backend && go vet ./...

  backend:
    runs-on: ubuntu-latest

    # A live Postgres is REQUIRED for this job, not optional. Before T11 the
    # backend suite ran here with no database and no HOLLER_TEST_DATABASE_URL,
    # so ~29 Postgres-backed integration tests skipped silently while the job
    # reported green — including TestBuildRouter_SyncConfigEndToEnd, the test
    # M2 acceptance item 4 names by hand. That is the M2 "a skip is not a pass"
    # failure institutionalised in the pipeline, and it is why
    # backend/internal/platform/testdb now FAILS on an unset variable instead
    # of skipping.
    #
    # Credentials mirror docker-compose.yml so the CI and local connection
    # strings are the same. Do NOT "fix" a red backend job by setting
    # HOLLER_SKIP_PG_TESTS here — that restores exactly the silent green this
    # service exists to remove.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: holler
          POSTGRES_PASSWORD: holler_dev
          POSTGRES_DB: holler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HOLLER_TEST_DATABASE_URL: postgres://holler:holler_dev@localhost:5432/holler?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # Schema comes from packages/contracts/postgres/*.sql. Most Postgres
      # tests call postgres.Migrate themselves, but internal/auth,
      # internal/menu and internal/tables assume the schema already exists
      # (they seed fixture rows straight into it) and never call Migrate.
      # Against an already-migrated database that assumption is invisible;
      # against this job's empty postgres:16-alpine service container it
      # races every other package's Migrate call — whichever test process
      # happens to query "tenant" before any Migrate call has committed
      # fails with "relation \"tenant\" does not exist", independent of the
      # concurrent-Migrate race fixed in postgres.Migrate itself (advisory
      # lock, backend/internal/platform/postgres/postgres.go). Applying the
      # schema once, up front, in its own step removes that ordering
      # dependency; postgres.Migrate is idempotent, so every package's own
      # Migrate call after this is a fast no-op. cmd/devseed is reused
      # rather than adding a new command: it just wraps postgres.Migrate
      # plus development-only fixture rows that are harmless alongside the
      # tests' own fixtures (fresh UUIDs, ON CONFLICT upserts).
      - name: migrate
        run: cd backend && go run ./cmd/devseed
      - name: test
        run: cd backend && go test -count=1 ./...
      # Guard the guard: the suite must not be able to report success without
      # actually running the Postgres-backed tests. If this ever prints a
      # nonzero count, the job above is green on skips and is lying.
      - name: assert no silent skips
        run: |
          cd backend
          count=$(go test -count=1 -v ./... 2>&1 | grep -c -- "--- SKIP" || true)
          echo "skipped tests: $count"
          test "$count" -eq 0

  # Contract-drift check (Milestone 0.5, ADR-008): fixtures under
  # packages/contracts/fixtures/ must round-trip identically through both
  # the Go and TypeScript representations. A Rust check joins this job when
  # edge/ implementation begins.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go drift test
        run: cd packages/contracts/go && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install contracts deps
        run: cd packages/contracts && npm install --no-save zod typescript vitest
      - name: ts drift test
        run: cd packages/contracts && npx vitest run
      # The Rust edge crates have no generated contract binding (deferred until
      # a fourth Rust consumer — ADR-011 addendum, 0.2.2), so their event_type
      # literals are unbound strings. A mismatch fails silently at replay: the
      # POS writes an outbox row the cloud never recognises, with no error.
      # This greps them against the frozen list in both directions.
      - name: event type drift check
        run: node scripts/check-event-type-drift.mjs
      # This script existed but was never run by CI — the "verify the runner,
      # not the file" defect, in the checker itself. It pins the CLAUDE.md
      # milestone block to .claude/current-milestone, and the contracts-version
      # + migration-high-water prose to package.json and the files on disk.
      - name: milestone + contracts marker check
        run: node scripts/check-milestone-marker.mjs
      # A cargo target behind `required-features` is not built, not run, and
      # not reported as skipped by a plain `cargo test`. This fails the build
      # if any such target is not invoked by a run line above.
      - name: gated tests are actually invoked
        run: node scripts/check-gated-tests.mjs
      # A field declared in the frozen contracts and read or written by no
      # consumer is a field that does not exist (CLAUDE.md). Five instances in
      # M4 alone, each found by hand. This catches the absent-everywhere class
      # only -- the header says plainly what it does not catch.
      - name: contract fields have consumers
        run: node scripts/check-contract-field-consumers.mjs
      # SQL -> Go/TS -> OpenAPI: this closes the last hop, and it had never
      # run here. The script has existed since 0.5.0 and says in its own header
      # that it exists because nothing machine-checked openapi.yaml — while
      # nothing machine-ran the script either, which is the same defect one
      # level out and the same one the milestone-marker step above records. On
      # its first CI run it found openapi.yaml missing all three
      # stock_ledger_entry provenance columns added at 0.6.0.
      - name: openapi matches the go mirrors
        run: node scripts/check-openapi-go-drift.mjs
      # The Go guard in backend/cmd/api/syncconfig_guard_test.go proves the
      # cloud SENDS a config column. It cannot prove an outlet STORES it, and
      # at 0.6.0 four procurement families passed that guard, shipped in every
      # bundle, and reached no outlet at all -- serde discards an unknown field
      # in silence. This is the other half of the wire.
      - name: the edge applies every config family the cloud sends
        run: node scripts/check-config-apply-drift.mjs

  # The Rust edge crates carry the majority of Milestone 1's test coverage —
  # including the offline order-creation test that IS the milestone acceptance
  # criterion, the encryption crash-recovery path, and the transactional
  # outbox guarantees. None of it ran in CI until now; it was green only
  # because it was run by hand on one machine. "Verified" has to mean a fresh
  # checkout reproduces it.
  #
  # apps/pos/src-tauri is deliberately NOT built here: Tauri needs Windows
  # (MSVC) plus WebView2 (ADR-013), and a Linux runner cannot honestly stand in
  # for the outlet target. Validating it belongs with the clean Windows 10 VM
  # item in docs/backlog.md, not with a green tick on ubuntu-latest.
  # Style only. These four crates' fmt and clippy checks used to be the first
  # two steps of the `edge` job below, which is exactly how four pushes went by
  # with no Rust test verdict at all. They gate the merge from here instead,
  # where failing tells you about formatting and nothing else.
  #
  # A crate absent from this list is a crate CI does not defend -- keep it
  # matching the edge/ directory, same as the `edge` job.
  #
  # rust-toolchain.toml pins the version, so `@stable` here is only a rustup
  # bootstrap; rustfmt's and clippy's output cannot drift under CI on their own
  # schedule any more.
  edge-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/database -> target
      - name: fmt
        run: |
          cd edge/database && cargo fmt --check
          cd ../sync && cargo fmt --check
          cd ../printer && cargo fmt --check
          cd ../device && cargo fmt --check
      # `--all-targets` does NOT mean all targets: a target with
      # `required-features` is invisible without the feature, so the criterion-6
      # test would compile for the first time in the `cloud-replay` job, where a
      # clippy error would read as a failed acceptance criterion. Same blindness
      # scripts/check-gated-tests.mjs guards on the test side, one job over.
      - name: clippy
        run: |
          cd edge/database && cargo clippy --all-targets -- -D warnings
          cd ../sync && cargo clippy --all-targets --features cloud-e2e -- -D warnings
          cd ../printer && cargo clippy --all-targets -- -D warnings
          cd ../device && cargo clippy --all-targets -- -D warnings

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/database -> target
      # Milestone 2 added printer and device. A crate absent from this list is
      # a crate CI does not defend, which is how edge/database's own drift went
      # unguarded until 0.2.3 — keep this list matching the edge/ directory.
      - name: test
        run: |
          cd edge/database && cargo test
          cd ../sync && cargo test
          cd ../printer && cargo test
          cd ../device && cargo test

  # M4 acceptance criterion 2: "kill the POS between confirm and deduction ->
  # order and ledger agree on reopen", judged against the crash rather than
  # against an API.
  #
  # WINDOWS, NOT LINUX. Crash durability is filesystem- and OS-specific, and
  # WAL recovery on Windows is what outlets actually run (ADR-013). A green
  # tick from ubuntu-latest would be evidence about a platform no outlet uses.
  #
  # IN CI, NOT A LOCAL GATE. The two PARKED items are local because they need
  # physical hardware nobody has yet; a process kill needs none. A durability
  # check run by hand proves the code was durable on the one day someone
  # remembered to run it -- which is how M2's acceptance item was recorded met
  # while silently failing to compile (docs/RESUME.md §4).
  #
  # ONLY this criterion needs Windows: criterion 1 is SQLite and Rust with no
  # network on the path by definition, so it runs in the `edge` job above, and
  # the cloud replay criterion runs on the Postgres-backed `backend` job. One
  # narrow job is the whole cost.
  crash-durability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/database -> target
      # `crash-points` is off by default and the crashpoint binary declares it
      # as a required-feature, so neither the abort point nor the binary that
      # drives it can reach a release build. The test spawns that binary,
      # waits for the abnormal exit, and reopens the same sealed file.
      - name: crash durability (M4 criterion 2)
        working-directory: edge/database
        run: cargo test --features crash-points --test crash_durability

  # Style only. Split out of `pos` so a lint or type error can never again
  # hide that app's test and build results -- see the note at the top of this
  # file. The duplicated install is the whole cost of that separation.
  # M4 acceptance criterion 6: "Ledger entries created at the edge replay to
  # the cloud and read back identically."
  #
  # THE ONLY JOB WHERE RUST AND GO MEET. Every other Rust-side cloud test in
  # this repo answers itself through a `tiny_http` fake that agrees with
  # whatever the edge says, so the fake was the risk: the pump's actual HTTP
  # conversation -- envelope shape, headers, enrollment, what comes back --
  # had never been checked against anything real. Here the real pump talks to
  # the real `cmd/api`, built from this checkout, over a real socket, against
  # a real PostgreSQL, holding a real device credential.
  #
  # The test creates and drops its own database per test, so it needs the
  # connection user to be able to CREATE DATABASE -- POSTGRES_USER is, and
  # that isolation is what lets the job be re-run without the second run
  # colliding on a per-outlet entry_seq the cloud already holds.
  #
  # Gated behind `cloud-e2e` because none of the above belongs in the `edge`
  # job, and invoked HERE because a gate nobody opens is not coverage --
  # scripts/check-gated-tests.mjs fails the build if this line disappears.
  cloud-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: holler
          POSTGRES_PASSWORD: holler_dev
          POSTGRES_DB: holler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HOLLER_TEST_DATABASE_URL: postgres://holler:holler_dev@localhost:5432/holler?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/sync -> target
      - name: edge -> cloud ledger replay (M4 criterion 6)
        working-directory: edge/sync
        run: cargo test --features cloud-e2e --test cloud_replay

  pos-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/pos && pnpm install --frozen-lockfile
      - name: typecheck
        run: cd apps/pos && pnpm exec tsc --noEmit
      # @typescript-eslint/unbound-method (T13, docs/retro.md 2026-08-11):
      # catches an unbound *class method* reference (e.g. `const fn =
      # this.doThing`), which silently loses `this` when called later. It
      # does NOT catch a bare global builtin (setInterval/fetch/WebSocket/...)
      # stored on a field without `.bind` â€” verified directly against the
      # sibling KDS bug: `lib.dom.d.ts` declares those globals as functions,
      # not interface methods, so the rule has no receiver to reason about.
      # See apps/pos/eslint.config.js for the full explanation. The
      # `pos-dev-server-smoke` job below is what guards that class here --
      # this step does not.
      - name: lint
        run: cd apps/pos && pnpm lint


  pos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/pos && pnpm install --frozen-lockfile
      - name: test
        run: cd apps/pos && pnpm test
      - name: build
        run: cd apps/pos && pnpm build

  # Style only. Split out of `kds` so a lint or type error can never again
  # hide that app's test and build results -- see the note at the top of this
  # file. The duplicated install is the whole cost of that separation.
  kds-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/kds && pnpm install --frozen-lockfile
      - name: typecheck
        run: cd apps/kds && pnpm exec tsc --noEmit
      # @typescript-eslint/unbound-method (T13, docs/retro.md 2026-08-11):
      # catches an unbound *class method* reference (e.g. `const fn =
      # this.doThing`), which silently loses `this` when called later. It
      # does NOT catch the actual bug this task exists because of â€” a bare
      # global builtin (setInterval/fetch/WebSocket/...) stored on a field
      # without `.bind`. Verified directly: reverting connectionController.ts's
      # `.bind(globalThis)` fix and re-running this lint produces zero errors.
      # `lib.dom.d.ts` declares those globals as functions, not interface
      # methods, so the rule has no receiver to reason about â€” see
      # apps/kds/eslint.config.js for the full explanation. The
      # `kds-browser-smoke` job below is what actually guards that bug, not
      # this step.
      - name: lint
        run: cd apps/kds && pnpm lint


  kds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/kds && pnpm install --frozen-lockfile
      - name: test
        run: cd apps/kds && pnpm test
      - name: build
        run: cd apps/kds && pnpm build

  # Real-browser smoke test (T13, docs/retro.md 2026-08-11: "The KDS crashed
  # in every browser while every test passed"). Every other KDS check above
  # runs under Node — vitest/jsdom timers, and lan-integration below drives
  # the real client modules from a Node process against a real compiled Rust
  # server. Both prove protocol; neither can observe a browser-only failure
  # mode like a detached global builtin. This job launches headless Chromium
  # against the built app and a small in-test stub WebSocket server (not
  # edge/device — that pairing is lan-integration's job) and fails on any
  # console error, which is the assertion that would have caught the
  # original bug.
  kds-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/kds && pnpm install --frozen-lockfile
      - name: install chromium
        run: cd apps/kds && pnpm exec playwright install --with-deps chromium
      - name: browser smoke test
        run: cd apps/kds && pnpm test:e2e

  # Real-browser smoke test against the DEV SERVER, which is a different
  # runtime from everything else in this file.
  #
  # TWO STRIKES, both invisible to tsc, vitest AND vite build: the 2026-08-20
  # POS white screen, and the 2026-08-30 stale `@holler/contracts` prebundle
  # that threw "does not provide an export" in the browser while every suite
  # stayed green. `optimizeDeps` is a dev-server mechanism `vite build` never
  # reads, so a build-based smoke test -- including the headless-Chromium one
  # used to DIAGNOSE the first incident -- cannot catch this class at all.
  #
  # It deliberately does NOT pass `--force`: forcing a re-optimise every run is
  # exactly what hides a stale prebundle. The test must run the dev server the
  # way a developer does, or it cannot see what a developer sees.
  #
  # The whole test is: drive `pnpm dev`, load the page, assert no console
  # error, assert the app actually rendered (a white screen throws nothing).
  # Falsified twice before landing -- against a doctored prebundle export and
  # against a throw on mount.
  pos-dev-server-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: install
        run: cd apps/pos && pnpm install --frozen-lockfile
      - name: install chromium
        run: cd apps/pos && pnpm exec playwright install --with-deps chromium
      - name: dev-server smoke test
        run: cd apps/pos && pnpm smoke

  # The KDS and the edge node are written in different languages and are
  # otherwise tested only against their own fakes. They already failed to
  # interoperate once — the server required handshake params the client did not
  # send, and both were faithful to the frozen contract, because lan.ts pinned
  # payloads and not the handshake. This job is the only thing that connects
  # them, so without it that class of break returns silently.
  lan-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/integration/kds-lan-bridge -> target
      - uses: actions/setup-node@v4
        with:
          # 22, NOT the 20 every other job pins. This suite drives a GENUINE
          # WebSocket and uses Node's own global one rather than taking a `ws`
          # dependency -- and that global is only unflagged from Node 22. On 20
          # every test in the file dies with `ReferenceError: WebSocket is not
          # defined`, which is what this job did from 2026-08-27 while the same
          # suite passed by hand on a developer box running Node 24.
          #
          # THAT IS THE SECOND TIME M2 ACCEPTANCE ITEM 5 WAS RECORDED AS MET
          # WHILE THIS JOB PROVED NO SOCKET SESSION AT ALL (docs/RESUME.md §5).
          # The first was a bridge that silently stopped compiling. Same
          # criterion, same job, different runtime: the test stated its own
          # requirement in a comment and nothing enforced it, so "it passes
          # locally" and "the build is green" drifted apart unnoticed.
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # The suite drives the real apps/kds client modules, so their deps must
      # be installed even though the test lives elsewhere.
      - name: install kds deps
        run: cd apps/kds && pnpm install --frozen-lockfile
      - name: install harness deps
        run: cd tests/integration/kds-lan && pnpm install --frozen-lockfile
      - name: build bridge
        run: cd tests/integration/kds-lan-bridge && cargo build
      - name: real socket session
        run: cd tests/integration/kds-lan && pnpm test

  # e2e-scenario-harness: an autonomous, randomized end-to-end scenario
  # harness for the full POS<->kitchen lifecycle (docs/retro.md, five
  # defects found by a human in one week that every green suite above
  # missed). Drives the real Tauri command *_impl functions in
  # apps/pos/src-tauri (holler_pos_lib), the real edge/device LAN server,
  # and the real apps/kds client modules over a genuine WebSocket — see
  # tests/e2e-scenario/README.md.
  #
  # Runs on windows-latest, unlike every other Rust/TS job in this file:
  # apps/pos/src-tauri (holler_pos_lib) is this job's direct dependency, and
  # the `pos` job's own comment is explicit that Tauri needs Windows/MSVC
  # (ADR-013) and a Linux runner cannot honestly stand in for it. This job
  # does not try to make that untrue; it is the one place a Windows runner
  # is the correct choice, not a deviation from it.
  #
  # This is the CI-*reduced* run only: 50 fixed-seed randomized scenarios
  # plus the 4 named regression cases (tests/e2e-scenario/orchestrator/src/
  # scenario.test.ts). It does not gate on every invariant passing — some
  # invariant failures here are KNOWN, already-diagnosed product defects
  # (see that file's own comment) that this track exists to surface, not to
  # fix; it gates on the harness itself staying green (no process-level
  # fatal error). The full 200+ scenario randomized run is a manual command
  # (docs/DEV_SETUP.md), not part of CI.
  # Producer/consumer seam gate (`make check-seams`). The Rust crates in this
  # repo are deliberately NOT one cargo workspace — edge/*, apps/pos/src-tauri
  # and each test bridge under tests/ carry their own Cargo.lock (the
  # e2e harness's own Cargo.toml is explicit that it is "not a workspace
  # member of any product crate"). The cost of that separation is that
  # `cargo check` inside the crate you edited proves nothing about the crates
  # that CALL it: change an `*_impl` signature in apps/pos/src-tauri and
  # nothing compiles the harness that calls it.
  #
  # That has now happened eight times. It was never caught by a test, because
  # the break is a compile error in a crate no job compiled early: the `pos`
  # job builds only the TypeScript side, `edge` never touches apps/pos, and
  # the one job that did compile the harness (e2e-scenario, below) is the
  # slowest in the file and only reaches `cargo` after two pnpm installs.
  #
  # This job exists to make the ninth break fail in about a minute, in a job
  # whose name says what broke, before any scenario runs. It compiles, and
  # does not run, every consumer crate that lives outside its producer's
  # workspace — --all-targets so their test binaries count as consumers too.
  # Windows for the same reason e2e-scenario is: apps/pos/src-tauri is Tauri
  # (ADR-013) and a Linux runner cannot honestly stand in for it.
  rust-seams:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/pos/src-tauri -> target
            tests/e2e-scenario/harness -> target
            tests/integration/kds-lan-bridge -> target
      - name: pos (Tauri crate + its own tests)
        run: cargo check --all-targets --manifest-path apps/pos/src-tauri/Cargo.toml
      - name: e2e-scenario harness (calls apps/pos's *_impl surface)
        run: cargo check --all-targets --manifest-path tests/e2e-scenario/harness/Cargo.toml
      - name: kds-lan bridge (calls edge/device's server surface)
        run: cargo check --all-targets --manifest-path tests/integration/kds-lan-bridge/Cargo.toml

  e2e-scenario:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/e2e-scenario/harness -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # The suite imports the real apps/kds client modules directly, so
      # their deps (including the @holler/contracts workspace package they
      # resolve against) must be installed even though the test lives
      # elsewhere — same reasoning as lan-integration's "install kds deps".
      - name: install kds deps
        run: cd apps/kds && pnpm install --frozen-lockfile
      - name: install orchestrator deps
        run: cd tests/e2e-scenario/orchestrator && pnpm install --frozen-lockfile
      - name: reduced randomized run (fixed seed, CI)
        run: cd tests/e2e-scenario/orchestrator && pnpm test
