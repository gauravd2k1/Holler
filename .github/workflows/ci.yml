name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: cd backend && go vet ./...
      - name: test
        run: cd backend && go test ./...

  # Contract-drift check (Milestone 0.5, ADR-008): fixtures under
  # packages/contracts/fixtures/ must round-trip identically through both
  # the Go and TypeScript representations. A Rust check joins this job when
  # edge/ implementation begins.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go drift test
        run: cd packages/contracts/go && go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install contracts deps
        run: cd packages/contracts && npm install --no-save zod typescript vitest
      - name: ts drift test
        run: cd packages/contracts && npx vitest run
