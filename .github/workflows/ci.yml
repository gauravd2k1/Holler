name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: cd backend && go vet ./...
      - name: test
        run: cd backend && go test ./...

  # Contract-drift check activates once packages/contracts/ has fixtures
  # (Milestone 0.5, ADR-008). Placeholder job kept intentionally minimal.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: placeholder
        run: echo "contract-drift check lands with Milestone 0.5"
