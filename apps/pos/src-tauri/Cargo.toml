[package]
name = "holler-pos"
version = "0.1.0"
description = "Holler POS Tauri app — Rust core (Milestone 1)"
edition = "2021"

[lib]
name = "holler_pos_lib"
path = "src/lib.rs"

[[bin]]
name = "holler-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Local ID generation for orders/order items created at the edge — UUIDv7
# (§74) so ids are k-sortable and edge-assigned, never waiting on the cloud.
uuid = { version = "1", features = ["v7"] }

# UTC timestamps for rows this crate creates (created_at/updated_at), ISO8601
# text to match the sqlite schema's TEXT columns (CLAUDE.md: UTC storage).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Owns SQLite access, encryption at rest, migrations and the transactional
# outbox (ADR-003, ADR-007, ADR-011). This crate consumes that API only —
# never touches the SQLite file directly.
holler-edge-database = { path = "../../../edge/database" }

# KOT print queueing/spool/retry (ADR-014, docs/spec/hardware-printing.md).
# This crate consumes that API only — never touches `print_job`/`printer`
# SQL directly.
holler-edge-printer = { path = "../../../edge/printer" }

# Embeds the KDS LAN WebSocket server (ADR-014 §6, T12): the POS is the
# process that mutates `kot` state, so it is also the process that must own
# the `Hub` those mutations notify — see src/state.rs's module doc for why
# this crate starts `server::start` itself rather than only depending on the
# standalone edge/device bin target.
holler-edge-device = { path = "../../../edge/device" }

# ADR-020: the POS process HOSTS the sync worker. Before this dependency
# existed, nothing in the repository depended on holler-edge-sync at all, so
# the config pull and every replay stream could only be driven by a test.
holler-edge-sync = { path = "../../../edge/sync" }

[dev-dependencies]
tempfile = "3"
# ADR-020 falsification: a fake cloud that acks, so the drain can be shown to
# publish BEFORE the seal and publish nothing AFTER it.
tiny_http = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
rand = "0.8"

[profile.release]
panic = "abort"
