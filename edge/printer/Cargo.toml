[package]
name = "holler-edge-printer"
version = "0.1.0"
edition = "2021"
description = "Edge printer service: ESC/POS adapter abstraction, KOT template rendering (58mm/80mm), the print spool with retry/backoff, and station->printer routing (ADR-014)."

[lib]
name = "holler_edge_printer"
path = "src/lib.rs"

[dependencies]
# Reuses the edge SQLite connection/migration machinery and the frozen `Kot`
# row shape rather than re-deriving either. `default-features = false` drops
# the transitively-brought "bundled" rusqlite feature duplication warning
# path (matches edge/sync's own dependency, which does the same for the same
# reason) — the actual static SQLite link comes from holler-edge-database.
holler-edge-database = { path = "../database" }

# For the print_job/station/printer/station_printer/kot SQL this crate runs
# directly against a `Connection` obtained from `holler_edge_database::Db`
# (which owns opening, pragmas and applying every migration, including
# 0005_m2_kitchen_stations_printers.sql — this crate does not re-apply
# schema). Version pinned to match edge/database's own dependency so Cargo
# unifies the build.
rusqlite = { version = "0.31", default-features = false }

thiserror = "1"

# Backoff scheduling for the spool sweep (src/spool.rs::due_jobs) and KOT
# status timestamps. Pure Rust, no OpenSSL/system dependency (ADR-013).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Parsing kot.items_json (the frozen KotTicketItem[] shape) for template
# rendering.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Renders the demo-build UPI QR on the HTML receipt (T11). `default-features
# = false` drops the "image" feature — the only feature with an actual
# dependency (the `image` crate, PNG/JPEG codecs: unwanted weight on 4GB
# spinning-disk hardware, ADR-013). "svg" is re-enabled explicitly: per the
# crate's own Cargo.toml, "svg" and "pic" are pure `#[cfg]` gates with an
# empty feature dependency list, so enabling "svg" alone adds zero
# transitive crates — confirmed with `cargo tree -p qrcode`, which prints
# only `qrcode v0.14.1` and nothing beneath it. This gets a self-contained
# inline `<svg>` string straight from the crate's own renderer rather than
# hand-rolling one against its bit-matrix internals.
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }

# Embeds the Holler mark on the HTML receipt header (T12) as an inline data
# URI — the receipt is a standalone file opened from disk, so an external
# asset reference renders as a broken image. `assets/receipt_logo.png` is
# `include_bytes!`-ed at compile time and base64-encoded once per render;
# no network fetch or image-decoding dependency needed, just the encoding.
base64 = "0.22"

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
tempfile = "3"
