[package]
name = "holler-edge-sync"
version = "0.1.0"
edition = "2021"
description = "Edge sync worker: outbox pump (edge→cloud) and config pull (cloud→edge) against Holler Cloud, enforcing the §50.1 authority split (ADR-009)."

[lib]
name = "holler_edge_sync"
path = "src/lib.rs"

[dependencies]
holler-edge-database = { path = "../database" }

# Only for the BEGIN/ROLLBACK/COMMIT wrapping a multi-row config-bundle apply
# spans (see src/config.rs::exec_batch) — edge/database exposes no
# transaction spanning several of its own repo calls made from outside the
# crate. All other SQLite access goes through holler_edge_database's typed
# repositories, never raw rusqlite calls. Version pinned to match
# edge/database's own dependency so Cargo unifies the build.
rusqlite = { version = "0.31", default-features = false }

# Blocking HTTP client with rustls (no system OpenSSL dependency on Windows,
# matching the "modest restaurant hardware, no server process" posture of
# edge/database's own dependency choices).
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# M4 acceptance criterion 6. OFF BY DEFAULT because the test behind it needs
# things no other test in this crate does: a live PostgreSQL, the Go toolchain,
# and the real `cmd/api` binary built from this checkout. `cargo test` in the
# `edge` CI job must stay a pure-Rust, no-network run.
#
# A gated target is only as good as the pipeline that remembers to invoke it,
# and "the test exists but never runs" is the exact state criterion 1 spent
# four pushes in. So scripts/check-gated-tests.mjs fails the build if any test
# target carrying `required-features` is not named in a ci.yml run line.
cloud-e2e = []

[[test]]
name = "cloud_replay"
required-features = ["cloud-e2e"]

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

# criterion 6 only (cloud-e2e): reads stock_ledger_entry straight out of
# PostgreSQL to prove STORAGE fidelity, next to the 201 echo which proves WIRE
# fidelity. No TLS feature -- the test connects with sslmode=disable to a
# local database and this crate ships nothing that talks to Postgres.
postgres = "0.19"
