[package]
name = "holler-edge-database"
version = "0.1.0"
edition = "2021"
description = "Edge SQLite database service: connection, migrations, encryption-at-rest, typed repositories and transactional outbox for the Holler POS edge node."

[lib]
name = "holler_edge_database"
path = "src/lib.rs"

[dependencies]
# SQLite driver. "bundled" statically links SQLite so the edge node has no
# system SQLite dependency (ADR-003: no separate server process, modest
# restaurant hardware).
rusqlite = { version = "0.31", features = ["bundled"] }

# Application-level encryption-at-rest (ADR-011 amendment to ADR-003). See
# src/crypto.rs for the SQLCipher-vs-application-level decision: this build
# environment cannot compile bundled SQLCipher (no working Perl/OpenSSL
# toolchain for MSVC — see final report), so the file is sealed with
# AES-256-GCM at rest and only ever holds plaintext SQLite bytes for the
# lifetime of an open Db handle.
aes-gcm = "0.10"
rand = "0.8"

# Offline Argon2id verification against hashes produced by
# backend/internal/platform/crypto/password.go (PHC-encoded).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"

# Local ID generation for outbox/session rows created at the edge. v7 is
# needed by the Milestone 2 kitchen path (send_order_to_kitchen_with_outbox):
# unlike every other write in this crate, the number of `kot` rows a
# send-to-kitchen call produces is not known to the caller ahead of time (it
# depends on station routing), so this crate mints those ids itself rather
# than accepting them from the caller (see model::SendToKitchenMeta).
uuid = { version = "1", features = ["v4", "v7"] }

thiserror = "1"

# Building the outbox event payloads this crate owns (ItemAdded), matching
# the JSON shape frozen in packages/contracts/src/types/events.ts.
serde_json = "1"

# RFC3339 instant parsing/comparison for the Milestone 3 tax engine's
# effective-dated resolution (`src/tax/resolve.rs`, ADR-016 Task 2). Every
# timestamp column in this crate is still stored and passed around as a plain
# ISO8601 `String` (unchanged elsewhere) — chrono is used only internally,
# at the point resolution needs true instant comparison rather than a string
# read/write round-trip. "clock"/"std" only; no wasm/js features needed on
# this target.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
